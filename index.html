<!-- JAVASCRIPT LOGIC (FIXED) -->
    <script>
        let rawStockData = [];
        let activeTab = "layakBeli";

        document.addEventListener("DOMContentLoaded", () => {
            loadData();
        });

        function formatWIB(timeStr) {
            if (!timeStr) return "-";
            try {
                const date = new Date(timeStr);
                if (isNaN(date.getTime())) return timeStr;
                return date.toLocaleString('id-ID', {
                    timeZone: 'Asia/Jakarta', day: '2-digit', month: 'long', year: 'numeric', hour: '2-digit', minute: '2-digit'
                }) + " WIB";
            } catch (e) { return timeStr; }
        }

        async function loadData() {
            const refreshIcon = document.getElementById("refreshIcon");
            if (refreshIcon) refreshIcon.classList.add("animate-spin");

            try {
                const response = await fetch(`./data.json?t=${new Date().getTime()}`);
                if (!response.ok) throw new Error("Gagal mengambil berkas data.json");
                
                const data = await response.json();
                if (data.updated_at) {
                    document.getElementById('updateTime').innerText = "DIPERBARUI: " + formatWIB(data.updated_at);
                }
                
                // Ambil array dari key `stocks`, `data`, atau jika root berupa Array langsung
                rawStockData = data.stocks || data.data || (Array.isArray(data) ? data : []);
                
                processAndRender();
            } catch (error) {
                console.error("Error loading stock data:", error);
                document.getElementById('updateTime').innerText = "GAGAL MEMUAT DATA.JSON";
            } finally {
                if (refreshIcon) refreshIcon.classList.remove("animate-spin");
            }
        }

        function processAndRender() {
            const timeframe = document.getElementById("tfSelect").value;
            const minTurnover = parseFloat(document.getElementById("turnoverSelect").value) || 0;
            const strongBuyFilter = document.getElementById("strongBuySelect").value;

            updateBannerInfo(timeframe);

            const processedStocks = rawStockData.map(stock => {
                const evaluation = evaluateIndicators(stock, minTurnover, timeframe);
                const stockTurnover = parseFloat(stock.turnover) || 0;
                
                // Kelonggaran Kriteria Layak Beli agar data tetap muncul
                const isBuyWorthy = (stockTurnover >= minTurnover) && 
                                    (evaluation.score >= 50 || evaluation.label.includes("BUY"));

                return { ...stock, eval: evaluation, isBuyWorthy: isBuyWorthy };
            });

            // Filter turnover dasar
            let validStocks = processedStocks.filter(s => (parseFloat(s.turnover) || 0) >= minTurnover);

            if (strongBuyFilter === "strongBuy") {
                validStocks = validStocks.filter(s => s.eval.isStrongBuy);
            }

            const displayStocks = activeTab === "layakBeli" 
                ? validStocks.filter(s => s.isBuyWorthy)
                : validStocks;

            document.getElementById("badgeLayakBeli").innerText = validStocks.filter(s => s.isBuyWorthy).length;
            document.getElementById("badgeAll").innerText = validStocks.length;

            renderViews(displayStocks);
        }

        function evaluateIndicators(stock, minTurnover, tf) {
            let score = 0;
            const price = parseFloat(stock.price) || 0;

            // 1. EMA
            if (stock.ema20 && stock.ema50 && stock.ema20 > stock.ema50 && price >= stock.ema20) score += 20;
            else if (stock.ema_status === 'BUY' || stock.signal === 'BUY') score += 20;

            // 2. RSI
            if (stock.rsi && stock.rsi >= 50 && stock.rsi <= 70) score += 20;
            else if (stock.rsi_status === 'BUY') score += 20;

            // 3. Volume
            if (stock.volRatio && stock.volRatio >= 1.5) score += 20;
            else if (parseFloat(stock.vol_ratio) >= 1.5 || stock.vol_status === 'BUY' || stock.bandarmology === 'AKUMULASI') score += 20;

            // 4. Turnover
            if ((parseFloat(stock.turnover) || 0) >= minTurnover) score += 20;

            // 5. High 52 / MACD
            if (stock.high52 && stock.high52 > 0) {
                const diffHigh = ((stock.high52 - price) / stock.high52) * 100;
                if (diffHigh <= 10) score += 20;
            } else if (stock.macd_status === 'BUY' || (stock.signal && stock.signal.includes("BUY"))) {
                score += 20;
            }

            const activeBoxes = Math.min(10, Math.max(1, Math.round(score / 10)));
            let label = stock.signal || "NEUTRAL";
            
            if (score >= 80 || label.includes("STRONG BUY")) label = "🚀🚀🚀 STRONG BUY";
            else if (score >= 40 || label.includes("BUY")) label = "BUY";
            else if (score <= 20 || label.includes("SELL")) label = "SELL";

            return {
                score: score,
                activeBoxes: activeBoxes,
                label: label,
                isStrongBuy: score >= 80 || label.includes("STRONG BUY")
            };
        }

        function renderViews(stocks) {
            const tbody = document.getElementById("stockTableBody");
            const cardGrid = document.getElementById("stockCardGrid");
            const emptyState = document.getElementById("emptyState");

            tbody.innerHTML = "";
            cardGrid.innerHTML = "";

            if (!stocks || stocks.length === 0) {
                emptyState.classList.remove("hidden");
                return;
            } else {
                emptyState.classList.add("hidden");
            }

            stocks.forEach(stock => {
                const ticker = stock.ticker || stock.code || "UNKNOWN";
                const changeVal = stock.change !== undefined ? parseFloat(stock.change) : 0;
                const isPos = changeVal >= 0;
                const changeClass = isPos ? "text-emerald-400" : "text-rose-400";
                const changeSign = isPos ? "+" : "";

                const entryVal = stock.entry || stock.entry_price || stock.price || '-';
                const r1Val = stock.r1 || stock.resistance_1 || stock.resistance || '-';
                const clVal = stock.cl1 || stock.cut_loss || stock.support_1 || stock.support || '-';
                const turnoverVal = stock.turnover !== undefined ? Number(stock.turnover).toFixed(1) : '0.0';

                // Desktop Row
                const tr = document.createElement("tr");
                tr.id = `stock-row-${ticker.toUpperCase()}`;
                tr.className = "hover:bg-slate-800/40 transition-colors border-b border-slate-800/50";
                tr.innerHTML = `
                    <td class="py-3.5 px-4 font-bold text-white">
                        <div class="text-sm">${ticker}</div>
                        <div class="text-[10px] text-slate-400 font-normal truncate max-w-[140px]">${stock.name || stock.category || ticker}</div>
                    </td>
                    <td class="py-3.5 px-3 text-right font-semibold text-slate-100">${Number(stock.price || 0).toLocaleString('id-ID')}</td>
                    <td class="py-3.5 px-3 text-right font-bold ${changeClass}">${changeSign}${Number(changeVal).toFixed(2)}%</td>
                    <td class="py-3.5 px-3 text-right font-medium text-slate-300">Rp ${turnoverVal} M</td>
                    <td class="py-3.5 px-4 text-center">
                        <div class="flex flex-col items-center gap-1">
                            ${renderBoxes(stock.eval.activeBoxes)}
                            <span class="text-[10px] font-extrabold ${stock.eval.isStrongBuy ? 'text-emerald-400 animate-pulse' : 'text-slate-300'}">
                                ${stock.eval.label}
                            </span>
                        </div>
                    </td>
                    <td class="py-3.5 px-3 text-center">
                        ${renderLightningBoxes(stock)}
                    </td>
                    <td class="py-3.5 px-4 text-center">
                        <div class="text-[11px] font-medium text-slate-300">
                            <span class="text-emerald-400">EP: ${entryVal}</span> | 
                            <span class="text-indigo-400">R1: ${r1Val}</span> | 
                            <span class="text-rose-400">CL: ${clVal}</span>
                        </div>
                    </td>
                `;
                tbody.appendChild(tr);

                // Mobile Card
                const card = document.createElement("div");
                card.id = `stock-card-${ticker.toUpperCase()}`;
                card.className = "bg-slate-950 border border-slate-800/80 rounded-xl p-3.5 flex flex-col gap-3 shadow-md";
                card.innerHTML = `
                    <div class="flex items-center justify-between border-b border-slate-800/60 pb-2">
                        <div>
                            <span class="text-base font-bold text-white tracking-wide">${ticker}</span>
                            <span class="text-[10px] text-slate-400 block font-normal truncate max-w-[180px]">${stock.name || stock.category || ticker}</span>
                        </div>
                        <div class="text-right">
                            <div class="text-sm font-extrabold text-slate-100">${Number(stock.price || 0).toLocaleString('id-ID')}</div>
                            <div class="text-xs font-bold ${changeClass}">${changeSign}${Number(changeVal).toFixed(2)}%</div>
                        </div>
                    </div>

                    <div class="grid grid-cols-2 gap-2 bg-slate-900/60 p-2.5 rounded-lg border border-slate-800/40 text-xs">
                        <div>
                            <span class="text-[10px] text-slate-400 block">Turnover</span>
                            <span class="font-semibold text-slate-200">Rp ${turnoverVal} M</span>
                        </div>
                        <div class="flex flex-col items-end">
                            <span class="text-[10px] text-slate-400 block">Bandarmology</span>
                            ${renderLightningBoxes(stock)}
                        </div>
                    </div>

                    <div class="flex flex-col items-center justify-center gap-1 bg-slate-900/40 p-2 rounded-lg border border-slate-800/30">
                        ${renderBoxes(stock.eval.activeBoxes)}
                        <span class="text-[11px] font-extrabold ${stock.eval.isStrongBuy ? 'text-emerald-400 animate-pulse' : 'text-slate-300'}">
                            ${stock.eval.label}
                        </span>
                    </div>

                    <div class="flex items-center justify-between text-[11px] pt-1 border-t border-slate-800/40 font-semibold">
                        <span class="text-emerald-400">EP: ${entryVal}</span>
                        <span class="text-indigo-400">R1: ${r1Val}</span>
                        <span class="text-rose-400">CL: ${clVal}</span>
                    </div>
                `;
                cardGrid.appendChild(card);
            });

            if (window.lucide) lucide.createIcons();
            handleSearch();
        }

        function renderBoxes(activeCount) {
            let boxesHTML = '<div class="flex items-center gap-0.5 justify-center">';
            for (let i = 1; i <= 10; i++) {
                boxesHTML += `<div class="w-2 h-3.5 ${i <= activeCount ? 'bg-emerald-500' : 'bg-slate-800'} rounded-sm"></div>`;
            }
            boxesHTML += '</div>';
            return boxesHTML;
        }

        function renderLightningBoxes(stock) {
            const bandarStatus = stock.bandarmology || (stock.vol_status === 'BUY' ? 'AKUMULASI' : (stock.vol_status === 'SELL' ? 'DISTRIBUSI' : 'NEUTRAL'));
            const isAkumulasi = bandarStatus === "AKUMULASI";
            const isBlink = stock.isBuyWorthy;
            
            let colorClass = "text-slate-700";
            if (isAkumulasi) {
                colorClass = isBlink ? "text-emerald-400 lightning-blink" : "text-emerald-500";
            } else if (bandarStatus === "DISTRIBUSI") {
                colorClass = "text-rose-500";
            }

            return `
                <div class="flex items-center gap-1">
                    <i data-lucide="zap" class="w-4 h-4 ${colorClass} fill-current"></i>
                    <span class="text-[10px] font-bold text-slate-300">${bandarStatus}</span>
                </div>
            `;
        }

        function switchTab(tab) {
            activeTab = tab;
            const btnLayak = document.getElementById("tabLayakBeli");
            const btnAll = document.getElementById("tabAll");

            if (tab === "layakBeli") {
                btnLayak.className = "pb-2 text-sm font-semibold border-b-2 border-indigo-500 text-indigo-400 flex items-center gap-2";
                btnAll.className = "pb-2 text-sm font-semibold border-b-2 border-transparent text-slate-400 hover:text-slate-200 flex items-center gap-2";
            } else {
                btnAll.className = "pb-2 text-sm font-semibold border-b-2 border-indigo-500 text-indigo-400 flex items-center gap-2";
                btnLayak.className = "pb-2 text-sm font-semibold border-b-2 border-transparent text-slate-400 hover:text-slate-200 flex items-center gap-2";
            }
            processAndRender();
        }

        function handleFilterChange() {
            processAndRender();
        }

        function handleSearch() {
            const query = document.getElementById("searchInput").value.trim().toUpperCase();

            document.querySelectorAll(".search-blink").forEach(el => {
                el.classList.remove("search-blink");
            });

            if (!query) return;

            const isMobile = window.innerWidth < 768;
            const targetId = isMobile ? `stock-card-${query}` : `stock-row-${query}`;
            const targetElement = document.getElementById(targetId);

            if (targetElement) {
                targetElement.scrollIntoView({ behavior: 'smooth', block: 'center' });
                targetElement.classList.add("search-blink");
            }
        }

        function updateBannerInfo(tf) {
            const title = document.getElementById("bannerTitle");
            const desc = document.getElementById("bannerDesc");

            if (tf === "swing") {
                title.innerText = "SWING TRADING STRATEGY (1D)";
                desc.innerText = "Fokus pada tren menengah (Daily). Mengalkulasi indikator teknikal utama: Trend EMA, RSI Momentum, Spike Volume, Likuiditas Pasar, dan kedekatan dengan 52-Week High.";
            } else if (tf === "scalping") {
                title.innerText = "SCALPING FAST STRATEGY (15M)";
                desc.innerText = "Fokus pada momentum intraday cepat. Mengutamakan lompatan Volume Ratio mendadak, break resistance terdekat, dan aliran arus kas cepat.";
            } else if (tf === "investment") {
                title.innerText = "LONG TERM INVESTMENT STRATEGY (1W)";
                desc.innerText = "Fokus pada akumulasi jangka panjang (Weekly). Memfilter emiten dengan fundamental likuiditas tinggi dan tren akumulasi besar konsisten.";
            }
        }

        if ('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js');
    </script>
