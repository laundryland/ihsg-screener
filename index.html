<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stock Screener & Bandarmology</title>
  
  <!-- CSS DIPASANG DI SINI -->
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
      margin: 0;
      padding: 12px;
    }

    /* Tampilan Ramping & Kompak */
    .container {
      max-width: 900px;
      margin: 0 auto;
    }

    h2 {
      margin: 0 0 8px 0;
      font-size: 16px;
      color: #38bdf8;
    }

    .updated-time {
      font-size: 11px;
      color: #94a3b8;
      margin-bottom: 12px;
    }

    .table-compact {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
      background-color: #1e293b;
      border-radius: 6px;
      overflow: hidden;
    }

    .table-compact th {
      background-color: #334155;
      color: #cbd5e1;
      text-align: left;
      padding: 6px 10px;
      font-weight: 600;
    }

    .table-compact td {
      padding: 6px 10px;
      border-bottom: 1px solid #334155;
    }

    .table-compact tr:hover {
      background-color: #334155;
    }

    /* Style 10 Kotak Indikator Power Bar */
    .power-bar-container {
      display: flex;
      gap: 2px;
      align-items: center;
    }

    .power-box {
      width: 6px;
      height: 12px;
      background-color: #475569; /* Abu-abu default/off */
      border-radius: 1px;
    }

    /* Warna Kotak Sesuai Sinyal */
    .power-box.green { background-color: #22c55e; }
    .power-box.red   { background-color: #ef4444; }
    .power-box.gray  { background-color: #94a3b8; }

    /* Animasi Blink Kedip */
    @keyframes blink-animation {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.2; }
    }

    .blink-green {
      background-color: #22c55e !important;
      animation: blink-animation 0.8s infinite;
    }

    .blink-red {
      background-color: #ef4444 !important;
      animation: blink-animation 0.8s infinite;
    }

    .txt-green { color: #4ade80; font-weight: bold; }
    .txt-red   { color: #f87171; font-weight: bold; }
  </style>
</head>
<body>

  <div class="container">
    <h2>IDX Bandarmology & Power Screener</h2>
    <div class="updated-time" id="last-update">Update: -</div>

    <table class="table-compact">
      <thead>
        <tr>
          <th>Ticker</th>
          <th>Harga</th>
          <th>Chg (%)</th>
          <th>Bandarmology</th>
          <th>Signal</th>
          <th>Power Bar (10 Kotak)</th>
        </tr>
      </thead>
      <tbody id="stock-list">
        <!-- Data akan dimuat lewat JavaScript -->
      </tbody>
    </table>
  </div>

  <!-- JAVASCRIPT DIPASANG DI SINI -->
  <script>
    // Fungsi membuat 10 kotak indikator (1 kotak = 10%)
    function renderPowerBar(score, signal) {
      const activeBoxes = Math.round(score / 10);
      let html = '<div class="power-bar-container">';

      for (let i = 1; i <= 10; i++) {
        let boxClass = "power-box";

        if (i <= activeBoxes) {
          if (signal === "STRONG BUY") {
            boxClass += " blink-green";
          } else if (signal === "BUY") {
            boxClass += " green";
          } else if (signal === "STRONG SELL") {
            boxClass += " blink-red";
          } else if (signal === "SELL") {
            boxClass += " red";
          } else {
            boxClass += " gray";
          }
        }
        html += `<div class="${boxClass}"></div>`;
      }

      html += `<span style="margin-left: 6px; font-size: 11px; color: #cbd5e1;">${score}%</span></div>`;
      return html;
    }

    // Membaca file data.json dan menampilkan ke tabel
    async function loadScreenerData() {
      try {
        const response = await fetch('data.json?t=' + new Date().getTime());
        const data = await response.json();

        document.getElementById('last-update').innerText = 'Update: ' + new Date(data.updatedAt).toLocaleString('id-ID');

        const tbody = document.getElementById('stock-list');
        tbody.innerHTML = '';

        data.stocks.forEach(stock => {
          const tr = document.createElement('tr');

          const changeClass = stock.change >= 0 ? 'txt-green' : 'txt-red';
          const changeSign = stock.change > 0 ? '+' : '';

          tr.innerHTML = `
            <td><strong>${stock.ticker}</strong></td>
            <td>${stock.price.toLocaleString('id-ID')}</td>
            <td class="${changeClass}">${changeSign}${stock.change}%</td>
            <td>${stock.bandarmology}</td>
            <td>${stock.signal}</td>
            <td>${renderPowerBar(stock.powerScore, stock.signal)}</td>
          `;

          tbody.appendChild(tr);
        });

      } catch (error) {
        console.error('Gagal memuat data.json:', error);
      }
    }

    // Jalankan pertama kali saat halaman dibuka
    loadScreenerData();
  </script>
</body>
</html>
