<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IHSG STOCK SCREENER PRO - SWING STRATEGY</title>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: #f4f6f9; 
            margin: 0; 
            padding: 6px; 
            text-transform: uppercase; 
        }
        
        .container { 
            max-width: 1000px; 
            margin: auto; 
            background: white; 
            padding: 8px; 
            border-radius: 6px; 
            box-shadow: 0 2px 8px rgba(0,0,0,0.1); 
        }
        
        /* Header Utama (TETAP CASE NORMAL/MIXED) */
        .main-header { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            margin-bottom: 6px; 
            padding-bottom: 4px; 
            border-bottom: 2px solid #2c3e50; 
        }
        h1 { 
            margin: 0; 
            color: #333; 
            font-size: 16px; 
            text-transform: none !important; 
        }

        /* IHSG Live Widget Badge */
        .ihsg-badge {
            background: #2c3e50;
            color: #fff;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: bold;
            display: flex;
            gap: 6px;
            align-items: center;
        }
        .ihsg-badge .ihsg-val { color: #2ecc71; }
        
        /* Header Control Panel (Sticky Header 1) */
        .header-controls { 
            display: flex; 
            flex-wrap: wrap; 
            gap: 6px; 
            align-items: center; 
            justify-content: space-between; 
            margin-bottom: 6px; 
            background: #eaedf1; 
            padding: 6px 10px; 
            border-radius: 4px; 
            position: sticky; 
            top: 0; 
            z-index: 1000; 
            box-shadow: 0 2px 5px rgba(0,0,0,0.08); 
        }
        .control-group { display: flex; align-items: center; gap: 4px; }
        .control-group label { font-size: 10px; font-weight: bold; color: #333; }
        .control-group input, .control-group button { 
            padding: 3px 6px; 
            border: 1px solid #ccc; 
            border-radius: 3px; 
            font-size: 10px; 
            text-transform: uppercase;
        }
        .control-group button { background: #2c3e50; color: white; cursor: pointer; display: flex; align-items: center; gap: 2px; }
        .control-group button:hover { background: #34495e; }

        /* Table Styling */
        table { width: 100%; border-collapse: collapse; margin-top: 2px; }
        th, td { padding: 5px 8px; text-align: left; border-bottom: 1px solid #e0e0e0; font-size: 11px; }
        
        /* Header Tabel (Sticky Header 2) */
        thead th { 
            position: sticky; 
            top: 33px; 
            z-index: 999; 
            background-color: #2c3e50; 
            color: white; 
            font-size: 11px;
            padding: 6px 8px;
        }
        
        tr:hover { background-color: #f8f9fa; }
        
        .positive { color: #27ae60; font-weight: bold; }
        .negative { color: #e74c3c; font-weight: bold; }
        
        .badge { padding: 2px 5px; border-radius: 3px; font-size: 0.75em; font-weight: bold; display: inline-block; }
        .badge-akumulasi { background: #d4edda; color: #155724; }
        .badge-distribusi { background: #f8d7da; color: #721c24; }
        .badge-neutral { background: #e2e3e5; color: #383d41; }

        /* Status Warna Baris */
        .status-strong-sell { background-color: #f8d7da !important; animation: blinkStrongSell 0.8s infinite; }
        .status-sell { background-color: #fdf2f2 !important; }

        /* Layout Kolom Power / Swing */
        .swing-container { 
            display: flex; 
            align-items: center; 
            justify-content: space-between; 
            width: 100%; 
        }
        .swing-left { display: flex; align-items: center; gap: 6px; }
        .boxes-group { display: flex; gap: 2px; }
        .swing-box-segment { width: 10px; height: 14px; border-radius: 2px; display: inline-block; }
        .box-green { background-color: #27ae60; }
        .box-red { background-color: #e74c3c; }
        .box-empty { background-color: #dcdde1; }
        
        .percent-middle { font-size: 10px; font-weight: bold; color: #444; }
        .buy-sell-right { text-align: right; min-width: 75px; }

        /* Animasi Blink Icon & Strong Sell */
        @keyframes blinkEffect {
            0% { opacity: 1; }
            50% { opacity: 0.3; }
            100% { opacity: 1; }
        }
        @keyframes blinkStrongSell {
            0% { background-color: #f8d7da; }
            50% { background-color: #f5c6cb; }
            100% { background-color: #f8d7da; }
        }
        .blink-icon { animation: blinkEffect 1s infinite; display: inline-block; }

        /* Efek Blink Baris saat Pencarian (Tepat 3 kali) */
        @keyframes rowBlink3Times {
            0% { background-color: #f1c40f; }
            50% { background-color: transparent; }
            100% { background-color: #f1c40f; }
        }
        .highlight-blink { 
            animation: rowBlink3Times 0.4s ease-in-out 3; 
        }
    </style>
</head>
<body>

<div class="container">
    <!-- Header Utama (Nama Aplikasi + Widget IHSG) -->
    <div class="main-header">
        <h1>IHSG Stock Screener Pro</h1>
        <div class="ihsg-badge" id="ihsgWidget">
            <span>IHSG:</span>
            <span class="ihsg-val" id="ihsgPrice">LOADING...</span>
            <span id="ihsgChange"></span>
        </div>
    </div>
    
    <!-- Header Controls (Sticky Header 1) -->
    <div class="header-controls">
        <div class="control-group">
            <label for="manualNominal">DANA:</label>
            <input type="text" id="manualNominal" value="5.000.000.000" style="width: 80px;" onblur="formatInputNominal(this)" onfocus="cleanInputNominal(this)">
        </div>

        <div class="control-group">
            <label for="searchTicker">CARI:</label>
            <input type="text" id="searchTicker" placeholder="TICKER..." style="width: 70px;" onkeyup="searchStock()">
        </div>

        <div class="control-group" style="margin-left: auto;">
            <button onclick="loadStockData()" title="REFRESH DATA">🔄 REFRESH</button>
            <button onclick="location.reload()" title="RELOAD PAGE">⚡ RELOAD</button>
        </div>
    </div>

    <!-- Tabel Data (Sticky Header 2 berada di thead) -->
    <table>
        <thead>
            <tr>
                <th style="width: 15%;">TICKER</th>
                <th style="width: 15%;">HARGA</th>
                <th style="width: 15%;">CHANGE</th>
                <th style="width: 15%;">BANDAR</th>
                <th style="width: 40%;">POWER / SIGNAL</th>
            </tr>
        </thead>
        <tbody id="stockTable">
            <!-- Render via JS -->
        </tbody>
    </table>
</div>

<script>
function formatNominal(val) {
    const num = Number(val);
    if (isNaN(num) || num === 0) return "0";
    return new Intl.NumberFormat('id-ID', { maximumFractionDigits: 0 }).format(num);
}

function formatNumber(val, decimals = 1) {
    const num = Number(val);
    return isNaN(num) ? "0" : num.toFixed(decimals);
}

function cleanInputNominal(el) {
    el.value = el.value.replace(/\./g, '');
}

function formatInputNominal(el) {
    const num = Number(el.value);
    if (!isNaN(num) && num > 0) {
        el.value = new Intl.NumberFormat('id-ID').format(num);
    } else {
        el.value = "5.000.000.000";
    }
    loadStockData();
}

function calculateSwingPower(stock, manualCapital) {
    const price = Number(stock.price) || 0;
    const rsi = Number(stock.rsi) || 50;
    const volRatio = Number(stock.volRatio) || 1;
    const ema20 = Number(stock.ema20) || price;
    const ema50 = Number(stock.ema50) || price;

    let scoreFactor = (price > ema20 ? 1 : 0) + (ema20 > ema50 ? 1 : 0);
    let rsiScore = (rsi >= 45 && rsi <= 65) ? 1 : (rsi > 65 ? 0.8 : 0.3);
    let volScore = volRatio > 1.1 ? 1 : 0.5;
    let capitalEffect = manualCapital >= 1000000000 ? 1 : 0.8;

    let rawScore = ((scoreFactor + rsiScore + volScore + capitalEffect) / 4.8) * 100;
    let totalPercent = Math.min(Math.max(rawScore, 0), 100);

    let activeBoxes = Math.round(totalPercent / 20);
    activeBoxes = Math.min(Math.max(activeBoxes, 0), 5);

    let isBearishStrong = totalPercent <= 30;
    let isStrongBuy = totalPercent >= 80;
    let isBullish = totalPercent >= 60;
    
    return {
        percent: totalPercent.toFixed(1),
        activeBoxes: isBearishStrong ? 5 : activeBoxes,
        isBearishStrong: isBearishStrong,
        isStrongBuy: isStrongBuy,
        isBullish: isBullish
    };
}

let globalStocksData = [];

async function loadStockData() {
    try {
        const response = await fetch('data.json?t=' + new Date().getTime());
        const data = await response.json();
        
        // Render Data IHSG Jika Ada
        if (data.ihsg) {
            document.getElementById('ihsgPrice').innerText = formatNominal(data.ihsg.price);
            const changeElem = document.getElementById('ihsgChange');
            const chg = Number(data.ihsg.change) || 0;
            const sign = chg >= 0 ? '+' : '';
            changeElem.innerText = `(${sign}${chg.toFixed(2)}%)`;
            changeElem.className = chg >= 0 ? 'positive' : 'negative';
        }

        globalStocksData = data.stocks || [];
        renderTable(globalStocksData);
    } catch (err) {
        console.error('GAGAL MEMUAT DATA.JSON:', err);
    }
}

function renderTable(stocks) {
    const tbody = document.getElementById('stockTable');
    tbody.innerHTML = '';

    const rawCapitalInput = document.getElementById('manualNominal').value.replace(/\./g, '');
    const currentCapital = Number(rawCapitalInput) || 5000000000;

    stocks.forEach((stock, index) => {
        const tr = document.createElement('tr');
        const tickerStr = stock.ticker ? stock.ticker.toUpperCase() : index;
        tr.id = 'row-' + tickerStr;
        
        const price = Number(stock.price) || 0;
        const change = Number(stock.change) || 0;
        const changeClass = change >= 0 ? 'positive' : 'negative';
        const changeSign = change >= 0 ? '+' : '';
        const bandarClass = 'badge-' + (stock.bandarmology || 'neutral').toLowerCase();

        const swing = calculateSwingPower(stock, currentCapital);

        // Pengaturan Baris: Hanya Merah/Strong Sell yang diwarnai latar belakang barisnya
        let rowStatusClass = '';
        let statusIcon = '';
        let recommendationText = '';

        if (swing.isBearishStrong) {
            rowStatusClass = swing.percent < 15 ? 'status-strong-sell' : 'status-sell';
            statusIcon = `<span class="blink-icon" title="STRONG SELL">⏳</span>`;
            recommendationText = `<span class="negative">STRONG SELL</span>`;
        } else if (swing.isBullish) {
            // Latar belakang baris bullish dibuat netral/transparan
            statusIcon = `<span class="${swing.isStrongBuy ? 'blink-icon' : ''}" title="${swing.isStrongBuy ? 'STRONG BUY' : 'BUY'}">🚀</span>`;
            recommendationText = `<span class="positive">${swing.isStrongBuy ? 'STRONG BUY' : 'BUY'}</span>`;
        } else {
            statusIcon = `<span title="NEUTRAL">👁️</span>`;
            recommendationText = `<span class="badge-neutral" style="padding:2px 4px;">NEUTRAL</span>`;
        }

        if (rowStatusClass) {
            tr.classList.add(rowStatusClass);
        }

        // Render Kotak: Ikon di Kiri, Persentase di Tengah, Buy/Sell di Pojok Kanan
        let boxesHtml = `<div class="boxes-group">`;
        for (let i = 1; i <= 5; i++) {
            let boxClass = 'box-empty';
            if (i <= swing.activeBoxes) {
                boxClass = swing.isBearishStrong ? 'box-red' : (swing.isBullish ? 'box-green' : 'box-red');
            }
            boxesHtml += `<span class="swing-box-segment ${boxClass}" title="KOTAK ${i} (20%)"></span>`;
        }
        boxesHtml += `</div>`;

        const powerColumnContent = `
            <div class="swing-container">
                <div class="swing-left">
                    ${statusIcon}
                    ${boxesHtml}
                </div>
                <div class="percent-middle">${swing.percent}%</div>
                <div class="buy-sell-right">${recommendationText}</div>
            </div>
        `;

        tr.innerHTML = `
            <td><strong>${stock.ticker || '-'}</strong></td>
            <td>${formatNominal(price)}</td>
            <td class="${changeClass}">${changeSign}${formatNumber(change, 2)}%</td>
            <td><span class="badge ${bandarClass}">${(stock.bandarmology || 'NEUTRAL').toUpperCase()}</span></td>
            <td>${powerColumnContent}</td>
        `;
        tbody.appendChild(tr);
    });
}

function searchStock() {
    const keyword = document.getElementById('searchTicker').value.trim().toUpperCase();
    if (!keyword) return;

    const matchedStock = globalStocksData.find(s => s.ticker && s.ticker.toUpperCase() === keyword);
    if (matchedStock) {
        const rowId = 'row-' + keyword;
        const targetRow = document.getElementById(rowId);
        if (targetRow) {
            targetRow.scrollIntoView({ behavior: 'smooth', block: 'center' });
            // Triggers CSS restart animation untuk blink tepat 3x
            targetRow.classList.remove('highlight-blink');
            void targetRow.offsetWidth; 
            targetRow.classList.add('highlight-blink');
        }
    }
}

loadStockData();
</script>

</body>
</html>
