<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Saham IHSG - Swing & Investasi</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
      --accent: #38bdf8;
      --green: #22c55e;
      --red: #ef4444;
      --yellow: #eab308;
    }

    body {
      font-family: 'Segoe UI', Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      margin: 0;
      padding: 20px;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      border-bottom: 1px solid #334155;
      padding-bottom: 15px;
    }

    h1 { margin: 0; font-size: 1.5rem; color: var(--accent); }
    .status-bar { font-size: 0.85rem; color: var(--text-sub); }

    .tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }

    .tab-btn {
      background: var(--card-bg);
      border: 1px solid #334155;
      color: var(--text-main);
      padding: 10px 20px;
      cursor: pointer;
      border-radius: 6px;
      font-weight: bold;
    }

    .tab-btn.active {
      background: var(--accent);
      color: #000;
      border-color: var(--accent);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background: var(--card-bg);
      border-radius: 8px;
      overflow: hidden;
    }

    th, td {
      padding: 12px 15px;
      text-align: left;
      border-bottom: 1px solid #334155;
    }

    th { background: #0f172a; color: var(--text-sub); font-size: 0.9rem; }
    
    .badge {
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 0.75rem;
      font-weight: bold;
    }
    .badge-buy { background: rgba(34, 197, 94, 0.2); color: var(--green); }
    .badge-sell { background: rgba(239, 68, 68, 0.2); color: var(--red); }
    .badge-neutral { background: rgba(234, 179, 8, 0.2); color: var(--yellow); }

    .price-up { color: var(--green); }
    .price-down { color: var(--red); }

    .loading-overlay {
      display: inline-block;
      font-size: 0.8rem;
      color: var(--accent);
    }
  </style>
</head>
<body>

  <div class="header">
    <div>
      <h1>IHSG Trading & Investment Monitor</h1>
      <div class="status-bar">
        Status Pasar: <span id="market-status">-</span> | 
        Pembaruan Terakhir: <span id="last-update">Menunggu Data...</span>
      </div>
    </div>
    <div id="loader" class="loading-overlay" style="display:none;">Refreshing Yahoo Finance...</div>
  </div>

  <div class="tabs">
    <button class="tab-btn active" onclick="switchTab('swing')">Strategi Swing Trading</button>
    <button class="tab-btn" onclick="switchTab('investasi')">Strategi Investasi</button>
  </div>

  <div id="content-area">
    <table id="stock-table">
      <thead>
        <tr id="table-headers"></tr>
      </thead>
      <tbody id="table-body"></tbody>
    </table>
  </div>

<script>
  let stockData = [];
  let currentTab = 'swing';
  const REFRESH_INTERVAL_MS = 30 * 60 * 1000; // 30 Menit

  // Memuat file JSON Lokal
  async function loadInitialJSON() {
    try {
      const response = await fetch('100emitendata.json');
      stockData = await response.json();
      renderTable();
      fetchRealtimePrices(); // Jalankan update harga otomatis
    } catch (err) {
      console.error("Gagal memuat 100emitendata.json:", err);
    }
  }

  // Ambil Data Yahoo Finance Secara Paralel (Jauh Lebih Cepat)
  async function fetchRealtimePrices() {
    const loader = document.getElementById('loader');
    loader.style.display = 'inline-block';
    loader.innerText = 'Memperbarui harga...';

    // Buat daftar request sekaligus (paralel)
    const requests = stockData.map(async (item) => {
      try {
        const targetUrl = encodeURIComponent(`https://query1.finance.yahoo.com/v8/finance/chart/${item.ticker}?interval=1m&range=1d`);
        const proxyUrl = `https://api.allorigins.win/get?url=${targetUrl}`;
        
        // Timeout 5 detik agar tidak menggantung jika koneksi lambat
        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 5000);

        const res = await fetch(proxyUrl, { signal: controller.signal });
        clearTimeout(timeoutId);

        const responseData = await res.json();
        const parsedData = JSON.parse(responseData.contents);

        if (parsedData.chart && parsedData.chart.result && parsedData.chart.result[0]) {
          const latestPrice = parsedData.chart.result[0].meta.regularMarketPrice;
          item.previousPrice = item.price;
          item.price = latestPrice;
        }
      } catch (e) {
        console.warn(`Gagal memperbarui harga untuk ${item.ticker}:`, e.message);
      }
    });

    // Jalankan semua permintaan secara bersamaan
    await Promise.all(requests);

    const now = new Date();
    document.getElementById('last-update').innerText = now.toLocaleTimeString('id-ID');
    loader.style.display = 'none';
    renderTable();
  }

  // Cek Jam Buka Pasar IHSG (Senin-Jumat 09:00 - 16:00 WIB)
  function checkMarketOpenStatus() {
    const now = new Date();
    const day = now.getDay();
    const hours = now.getHours();
    const minutes = now.getMinutes();

    const isWeekday = day >= 1 && day <= 5;
    const isOpenTime = (hours > 9 || (hours === 9 && minutes >= 0)) && hours < 16;
    const isMarketOpen = isWeekday && isOpenTime;

    const statusEl = document.getElementById('market-status');
    if (isMarketOpen) {
      statusEl.innerText = "OPEN MARKET";
      statusEl.style.color = "var(--green)";
    } else {
      statusEl.innerText = "CLOSED";
      statusEl.style.color = "var(--red)";
    }

    if (isWeekday && hours === 9 && minutes === 0) {
      fetchRealtimePrices();
    }
  }

  // Beralih Tab UI
  function switchTab(tab) {
    currentTab = tab;
    document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
    event.target.classList.add('active');
    renderTable();
  }

  // Render Tabel
  function renderTable() {
    const headersEl = document.getElementById('table-headers');
    const bodyEl = document.getElementById('table-body');

    if (currentTab === 'swing') {
      headersEl.innerHTML = `
        <th>Ticker</th>
        <th>Nama Emiter</th>
        <th>Harga Realtime</th>
        <th>Area Entry</th>
        <th>Target (R1)</th>
        <th>Cut Loss (CL1)</th>
        <th>Sinyal</th>
        <th>Bandarmology</th>
      `;

      bodyEl.innerHTML = stockData.map(s => `
        <tr>
          <td><strong>${s.ticker}</strong></td>
          <td>${s.name}</td>
          <td class="${s.previousPrice ? (s.price >= s.previousPrice ? 'price-up' : 'price-down') : ''}">
            Rp ${s.price.toLocaleString('id-ID')}
          </td>
          <td>Rp ${s.swing.entry.toLocaleString('id-ID')}</td>
          <td class="price-up">Rp ${s.swing.r1.toLocaleString('id-ID')}</td>
          <td class="price-down">Rp ${s.swing.cl1.toLocaleString('id-ID')}</td>
          <td><span class="badge ${s.signal.includes('BUY') ? 'badge-buy' : 'badge-neutral'}">${s.signal}</span></td>
          <td><span class="badge ${s.bandarmology === 'AKUMULASI' ? 'badge-buy' : 'badge-neutral'}">${s.bandarmology}</span></td>
        </tr>
      `).join('');

    } else if (currentTab === 'investasi') {
      headersEl.innerHTML = `
        <th>Ticker</th>
        <th>Nama Emiter</th>
        <th>Harga Realtime</th>
        <th>Target 1 Tahun</th>
        <th>Valuasi (PBV)</th>
        <th>Sinyal</th>
        <th>Bandarmology</th>
      `;

      bodyEl.innerHTML = stockData.map(s => `
        <tr>
          <td><strong>${s.ticker}</strong></td>
          <td>${s.name}</td>
          <td>Rp ${s.price.toLocaleString('id-ID')}</td>
          <td class="price-up">Rp ${s.investasi.target_1y.toLocaleString('id-ID')}</td>
          <td>${s.investasi.valas_pbv}x</td>
          <td><span class="badge ${s.signal.includes('BUY') ? 'badge-buy' : 'badge-neutral'}">${s.signal}</span></td>
          <td><span class="badge ${s.bandarmology === 'AKUMULASI' ? 'badge-buy' : 'badge-neutral'}">${s.bandarmology}</span></td>
        </tr>
      `).join('');
    }
  }

  // Inisialisasi
  loadInitialJSON();
  checkMarketOpenStatus();

  // Interval Refresh
  setInterval(fetchRealtimePrices, REFRESH_INTERVAL_MS);
  setInterval(checkMarketOpenStatus, 60000);
</script>
</body>
</html>
