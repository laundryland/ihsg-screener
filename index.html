<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Emiten Saham</title>
  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #f4f7f6; margin: 0; padding: 20px; color: #333; }
    .container { max-width: 1000px; margin: 0 auto; }
    
    /* Header & Control Panel */
    .controls {
      background: white;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      margin-bottom: 20px;
      display: flex;
      gap: 15px;
      align-items: center;
      flex-wrap: wrap;
    }
    select {
      padding: 10px 15px;
      border: 1px solid #ccc;
      border-radius: 5px;
      font-size: 14px;
      outline: none;
      min-width: 250px;
    }
    
    /* Grid Layar Utama */
    .grid-container {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 15px;
    }
    
    /* Kartu Emiten */
    .card {
      background: white;
      border-radius: 8px;
      padding: 15px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.08);
      position: relative;
      border-left: 5px solid #007bff;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .card:hover { transform: translateY(-3px); box-shadow: 0 4px 10px rgba(0,0,0,0.15); }
    .card.kesehatan { border-left-color: #28a745; }
    .card.perbankan { border-left-color: #007bff; }
    .card.konsumsi { border-left-color: #ffc107; }
    .card.telekomunikasi { border-left-color: #17a2b8; }
    .card.energi { border-left-color: #dc3545; }

    .card h3 { margin: 0 0 5px 0; font-size: 18px; color: #111; }
    .card p { margin: 0 0 10px 0; font-size: 13px; color: #666; }
    .badge {
      display: inline-block;
      padding: 3px 8px;
      font-size: 11px;
      background: #e9ecef;
      border-radius: 4px;
      font-weight: 600;
    }

    /* Tombol X (Sembunyikan) */
    .btn-close {
      position: absolute;
      top: 10px;
      right: 10px;
      background: transparent;
      border: none;
      color: #aaa;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      width: 25px;
      height: 25px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s, color 0.2s;
    }
    .btn-close:hover { background: #fee2e2; color: #dc3545; }
    
    .empty-state {
      grid-column: 1 / -1;
      text-align: center;
      padding: 40px;
      color: #888;
      background: white;
      border-radius: 8px;
    }
  </style>
</head>
<body>

  <div class="container">
    <h2>Dashboard Emiten Saham</h2>
    
    <div class="controls">
      <label for="selectEmiten"><strong>Tambah/Tampilkan Emiten:</strong></label>
      <select id="selectEmiten" onchange="tampilkanEmiten(this.value)">
        <option value="">-- Pilih Emiten --</option>
      </select>
    </div>

    <!-- Container Utama Kartu -->
    <div id="emitenGrid" class="grid-container"></div>
  </div>

  <script>
    // Data Emiten Saham Lengkap dengan Kategori Kesehatan & Sektor Lainnya
    const daftarEmiten = [
      // KESEHATAN
      { kode: "MIKA", nama: "Mitra Keluarga", sektor: "kesehatan", kategori: "Rumah Sakit", visible: true },
      { kode: "HEAL", nama: "Medikaloka Hermina", sektor: "kesehatan", kategori: "Rumah Sakit", visible: false },
      { kode: "SILO", nama: "Siloam International", sektor: "kesehatan", kategori: "Rumah Sakit", visible: false },
      { kode: "KLBF", nama: "Kalbe Farma", sektor: "kesehatan", kategori: "Farmasi", visible: true },
      { kode: "TSPC", nama: "Tempo Scan Pacific", sektor: "kesehatan", kategori: "Farmasi", visible: false },
      { kode: "KAEF", nama: "Kimia Farma", sektor: "kesehatan", kategori: "Farmasi", visible: false },
      { kode: "SAME", nama: "Sarana Meditama", sektor: "kesehatan", kategori: "Rumah Sakit", visible: false },

      // PERBANKAN
      { kode: "BBCA", nama: "Bank Central Asia", sektor: "perbankan", kategori: "Bank Swasta", visible: true },
      { kode: "BBRI", nama: "Bank Rakyat Indonesia", sektor: "perbankan", kategori: "Bank BUMN", visible: true },
      { kode: "BMRI", nama: "Bank Mandiri", sektor: "perbankan", kategori: "Bank BUMN", visible: false },
      { kode: "BBNI", nama: "Bank Negara Indonesia", sektor: "perbankan", kategori: "Bank BUMN", visible: false },

      // KONSUMSI
      { kode: "ICBP", nama: "Indofood CBP", sektor: "konsumsi", kategori: "Makanan & Minuman", visible: true },
      { kode: "UNVR", nama: "Unilever Indonesia", sektor: "konsumsi", kategori: "Barang Konsumsi", visible: false },
      { kode: "MYOR", nama: "Mayora Indah", sektor: "konsumsi", kategori: "Makanan & Minuman", visible: false },

      // TELEKOMUNIKASI
      { kode: "TLKM", nama: "Telkom Indonesia", sektor: "telekomunikasi", kategori: "Infrastruktur", visible: true },
      { kode: "ISAT", nama: "Indosat Ooredoo", sektor: "telekomunikasi", kategori: "Operator", visible: false },

      // ENERGI
      { kode: "ADRO", nama: "Adaro Energy", sektor: "energi", kategori: "Batubara", visible: false },
      { kode: "PGAS", nama: "Perusahaan Gas Negara", sektor: "energi", kategori: "Minyak & Gas", visible: false }
    ];

    // 1. Render Kartu di Layar Utama (Hanya yang status visible = true)
    function renderLayarUtama() {
      const grid = document.getElementById("emitenGrid");
      grid.innerHTML = "";

      const emitenTampil = daftarEmiten.filter(item => item.visible);

      if (emitenTampil.length === 0) {
        grid.innerHTML = `<div class="empty-state">Tidak ada emiten di layar utama. Pilih dari menu di atas untuk menampilkan.</div>`;
        return;
      }

      emitenTampil.forEach(item => {
        const card = document.createElement("div");
        card.className = `card ${item.sektor}`;
        card.innerHTML = `
          <button class="btn-close" onclick="sembunyikanEmiten('${item.kode}')" title="Sembunyikan dari layar utama">&times;</button>
          <h3>${item.kode}</h3>
          <p>${item.nama}</p>
          <span class="badge">${item.kategori}</span>
        `;
        grid.appendChild(card);
      });
    }

    // 2. Render Dropdown Pilihan (Hanya emiten yang tersembunyi / visible = false)
    function renderDropdown() {
      const select = document.getElementById("selectEmiten");
      select.innerHTML = `<option value="">-- Pilih Emiten untuk Ditambahkan --</option>`;

      const emitenHidden = daftarEmiten.filter(item => !item.visible);

      emitenHidden.forEach(item => {
        const option = document.createElement("option");
        option.value = item.kode;
        option.textContent = `[${item.sektor.toUpperCase()}] ${item.kode} - ${item.nama}`;
        select.appendChild(option);
      });
    }

    // 3. Fungsi Tombol X: Sembunyikan dari Layar Utama -> Otomatis Kembali ke Dropdown
    function sembunyikanEmiten(kode) {
      const target = daftarEmiten.find(item => item.kode === kode);
      if (target) {
        target.visible = false;
        refreshUI();
      }
    }

    // 4. Fungsi Pilih dari Dropdown: Tampilkan ke Layar Utama -> Hapus dari Dropdown
    function tampilkanEmiten(kode) {
      if (!kode) return;
      const target = daftarEmiten.find(item => item.kode === kode);
      if (target) {
        target.visible = true;
        refreshUI();
      }
    }

    // Utility untuk memperbarui seluruh tampilan layar
    function refreshUI() {
      renderLayarUtama();
      renderDropdown();
    }

    // Jalankan pertama kali saat halaman dimuat
    refreshUI();
  </script>

</body>
</html>
