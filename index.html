<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Screener Saham Multi-Strategi</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .tab-active {
            border-bottom: 4px solid #2563eb;
            color: #2563eb;
            font-weight: bold;
        }
    </style>
</head>
<body class="bg-gray-100 font-sans text-gray-800">

    <div class="container mx-auto px-4 py-8">
        <!-- HEADER -->
        <header class="mb-8 text-center">
            <h1 class="text-3xl font-extrabold text-gray-900 mb-2">Screener & Analytics Saham IHSG</h1>
            <p class="text-gray-600">Rekomendasi teknikal terintegrasi berdasarkan pilihan gaya trading Anda.</p>
            <p id="updated-at" class="text-xs text-gray-400 mt-1"></p>
        </header>

        <!-- 3 TAB STRATEGI HEADER -->
        <div class="bg-white rounded-xl shadow-md mb-8 overflow-hidden">
            <div class="grid grid-cols-1 md:grid-cols-3 text-center border-b border-gray-200">
                
                <!-- Tab 1: Scalping -->
                <button onclick="switchTab('scalping')" id="tab-scalping" class="tab-btn py-4 px-6 text-gray-600 hover:text-blue-600 font-semibold flex flex-col items-center justify-center border-b-2 md:border-b-0 md:border-r border-gray-100 transition">
                    <span class="text-lg">1. Scalping / Short-term</span>
                    <span class="text-xs font-normal text-gray-500 mt-1">Orderbook, Momentum RSI & Volumemania</span>
                </button>

                <!-- Tab 2: Swing -->
                <button onclick="switchTab('swing')" id="tab-swing" class="tab-btn py-4 px-6 text-gray-600 hover:text-blue-600 font-semibold flex flex-col items-center justify-center border-b-2 md:border-b-0 md:border-r border-gray-100 transition">
                    <span class="text-lg">2. Swing / Middle-term</span>
                    <span class="text-xs font-normal text-gray-500 mt-1">MA20, Support/Resistance & MACD Crossover</span>
                </button>

                <!-- Tab 3: Investasi -->
                <button onclick="switchTab('investasi')" id="tab-investasi" class="tab-btn py-4 px-6 text-gray-600 hover:text-blue-600 font-semibold flex flex-col items-center justify-center transition">
                    <span class="text-lg">3. Investasi / Long-term</span>
                    <span class="text-xs font-normal text-gray-500 mt-1">Trend Base MA20, Value Range & Diskon Fibo</span>
                </button>

            </div>
        </div>

        <!-- SEARCH & FILTER -->
        <div class="flex flex-col md:flex-row justify-between items-center mb-6 gap-4">
            <input type="text" id="search-input" onkeyup="renderData()" placeholder="Cari Kode Ticker (contoh: BBCA)..." class="w-full md:w-1/3 px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
            <div class="text-sm text-gray-500">
                Menampilkan data untuk strategi: <span id="current-strategy-label" class="font-bold text-blue-600">Scalping</span>
            </div>
        </div>

        <!-- CONTAINER KARTU SAHAM -->
        <div id="stock-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <!-- Data akan di-load lewat JavaScript -->
        </div>
    </div>

    <!-- JAVASCRIPT LOGIC -->
    <script>
        let globalData = [];
        let currentStrategy = 'scalping'; // Default: scalping

        // Fetch data.json
        async function loadStockData() {
            try {
                const response = await fetch('data.json');
                const data = await response.json();
                globalData = data.stocks;
                
                document.getElementById('updated-at').innerText = `Terakhir Diperbarui: ${new Date(data.updated_at).toLocaleString('id-ID')}`;
                
                switchTab('scalping'); // Default tab
            } catch (error) {
                console.error("Gagal memuat data.json:", error);
                document.getElementById('stock-container').innerHTML = `<p class="text-red-500 text-center col-span-3">Gagal memuat data JSON. Pastikan script Python sudah dijalankan.</p>`;
            }
        }

        // Fungsi Ganti Tab
        function switchTab(strategy) {
            currentStrategy = strategy;
            
            // Reset tab style
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('tab-active', 'bg-blue-50'));
            
            // Set active style
            const activeTab = document.getElementById(`tab-${strategy}`);
            activeTab.classList.add('tab-active', 'bg-blue-50');

            // Update Label
            const labels = {
                'scalping': 'Scalping / Short-term (Menit - Hari)',
                'swing': 'Swing / Middle-term (Minggu - Bulan)',
                'investasi': 'Investasi / Long-term (Bulan - Tahun)'
            };
            document.getElementById('current-strategy-label').innerText = labels[strategy];

            renderData();
        }

        // Kalkulasi Level TP, CL, dan Area Entry Berdasarkan Strategi
        function calculateLevels(stock, strategy) {
            const price = stock.price;
            const supp = stock.support;
            const res = stock.resistance;

            if (strategy === 'scalping') {
                // Scalping: TP tipis (1-3%), CL sangat ketat (1-2%)
                return {
                    entryArea: `${price} - ${Math.round(price * 1.005)}`,
                    tp1: Math.round(price * 1.015), // +1.5%
                    tp2: Math.round(price * 1.025), // +2.5%
                    tp3: Math.round(price * 1.040), // +4.0%
                    cl1: Math.round(price * 0.990), // -1.0%
                    cl2: Math.round(price * 0.980), // -2.0%
                    cl3: Math.round(price * 0.970), // -3.0%
                    timeframe: '1 - 3 Hari (Fast Trade)',
                    indicatorInfo: `RSI: ${stock.rsi} | Vol Ratio: ${stock.vol_ratio}x`
                };
            } else if (strategy === 'swing') {
                // Swing: Menyesuaikan Area Support/Resistance & MA20
                return {
                    entryArea: `${Math.round(supp * 1.01)} - ${Math.round(price)}`,
                    tp1: Math.round(price + (res - price) * 0.5), 
                    tp2: res, 
                    tp3: Math.round(res * 1.08), 
                    cl1: Math.round(supp * 0.99), 
                    cl2: Math.round(supp * 0.97), 
                    cl3: Math.round(supp * 0.95), 
                    timeframe: '1 - 4 Minggu',
                    indicatorInfo: `MACD: ${stock.macd_status} | MA20: ${stock.ma20}`
                };
            } else {
                // Investasi: Buy on Weakness / Area Diskon
                const buyLow = Math.min(supp, Math.round(price * 0.95));
                return {
                    entryArea: `${buyLow} - ${price}`,
                    tp1: Math.round(price * 1.15), // +15%
                    tp2: Math.round(price * 1.30), // +30%
                    tp3: Math.round(price * 1.50), // +50%
                    cl1: Math.round(buyLow * 0.92), // -8%
                    cl2: Math.round(buyLow * 0.85), // -15%
                    cl3: Math.round(buyLow * 0.80), // -20%
                    timeframe: '3 - 12+ Bulan',
                    indicatorInfo: `Fibo/RSI: ${stock.fibo_rsi_status} | Base Supp: ${stock.support}`
                };
            }
        }

        // Render Kartu Saham
        function renderData() {
            const container = document.getElementById('stock-container');
            const searchVal = document.getElementById('search-input').value.toUpperCase();
            container.innerHTML = '';

            const filteredData = globalData.filter(s => s.ticker.includes(searchVal));

            if (filteredData.length === 0) {
                container.innerHTML = `<p class="text-center text-gray-500 col-span-3">Emiten tidak ditemukan.</p>`;
                return;
            }

            filteredData.forEach(stock => {
                const lvl = calculateLevels(stock, currentStrategy);
                
                // Badge Sinyal
                let signalBadge = 'bg-gray-100 text-gray-800';
                if (stock.signal.includes('BUY')) signalBadge = 'bg-green-100 text-green-800 font-bold';
                if (stock.signal.includes('SELL')) signalBadge = 'bg-red-100 text-red-800 font-bold';

                const cardHtml = `
                    <div class="bg-white rounded-xl shadow-md hover:shadow-lg transition p-5 border border-gray-100 flex flex-col justify-between">
                        <div>
                            <!-- Header Kartu -->
                            <div class="flex justify-between items-start mb-3">
                                <div>
                                    <h2 class="text-xl font-bold text-gray-900">${stock.ticker}</h2>
                                    <span class="text-xs text-gray-500">${stock.category}</span>
                                </div>
                                <div class="text-right">
                                    <span class="text-lg font-bold">Rp ${stock.price.toLocaleString('id-ID')}</span>
                                    <div class="text-xs px-2 py-0.5 rounded ${signalBadge} mt-1 inline-block">
                                        ${stock.signal}
                                    </div>
                                </div>
                            </div>

                            <!-- Context Indicator -->
                            <div class="bg-gray-50 p-2.5 rounded-lg text-xs text-gray-600 mb-4 flex justify-between">
                                <span>${lvl.indicatorInfo}</span>
                                <span class="font-semibold text-blue-600">${lvl.timeframe}</span>
                            </div>

                            <!-- Area Entry -->
                            <div class="mb-3">
                                <span class="text-xs text-gray-500 uppercase font-semibold">Area Entry Ideal</span>
                                <div class="text-sm font-bold text-blue-700 bg-blue-50 px-3 py-1.5 rounded border border-blue-100 mt-1">
                                    Rp ${lvl.entryArea}
                                </div>
                            </div>

                            <!-- Level Target Profit (TP) & Cut Loss (CL) -->
                            <div class="grid grid-cols-2 gap-3 mb-4">
                                <!-- Take Profit -->
                                <div class="bg-green-50 p-2.5 rounded-lg border border-green-100">
                                    <span class="text-xs font-bold text-green-700 uppercase block mb-1">Take Profit</span>
                                    <ul class="text-xs space-y-1 text-green-900">
                                        <li><strong>TP 1:</strong> Rp ${lvl.tp1.toLocaleString('id-ID')}</li>
                                        <li><strong>TP 2:</strong> Rp ${lvl.tp2.toLocaleString('id-ID')}</li>
                                        <li><strong>TP 3:</strong> Rp ${lvl.tp3.toLocaleString('id-ID')}</li>
                                    </ul>
                                </div>

                                <!-- Cut Loss -->
                                <div class="bg-red-50 p-2.5 rounded-lg border border-red-100">
                                    <span class="text-xs font-bold text-red-700 uppercase block mb-1">Cut Loss</span>
                                    <ul class="text-xs space-y-1 text-red-900">
                                        <li><strong>CL 1:</strong> Rp ${lvl.cl1.toLocaleString('id-ID')}</li>
                                        <li><strong>CL 2:</strong> Rp ${lvl.cl2.toLocaleString('id-ID')}</li>
                                        <li><strong>CL 3:</strong> Rp ${lvl.cl3.toLocaleString('id-ID')}</li>
                                    </ul>
                                </div>
                            </div>
                        </div>

                        <!-- Footer Kartu -->
                        <div class="text-xs text-gray-400 border-t pt-2 flex justify-between">
                            <span>Supp: ${stock.support}</span>
                            <span>Res: ${stock.resistance}</span>
                        </div>
                    </div>
                `;
                container.innerHTML += cardHtml;
            });
        }

        // Inisialisasi saat load
        window.onload = loadStockData;
    </script>
</body>
</html>
