<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Screener Saham BEI</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; background-color: #f4f6f9; }
    
    /* Layout Header Utama */
    .main-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #ffffff;
      padding: 15px 20px;
      border-radius: 8px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      margin-bottom: 20px;
    }
    .timeframe-group {
      display: flex;
      gap: 12px; /* Spasi lebar antar opsi */
    }
    .style-btn {
      padding: 8px 16px;
      border: 1px solid #ced4da;
      background: #e9ecef;
      color: #495057;
      border-radius: 5px;
      cursor: pointer;
      font-weight: bold;
      transition: all 0.2s;
    }
    .style-btn.active {
      background: #0d6efd;
      color: #ffffff;
      border-color: #0d6efd;
    }
    .refresh-btn {
      padding: 8px 16px;
      background: #198754;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-weight: bold;
    }
    .refresh-btn:hover { background: #146c43; }

    /* Tabel Style */
    table { width: 100%; border-collapse: collapse; background: white; border-radius: 8px; overflow: hidden; }
    th, td { padding: 12px; text-align: left; border-bottom: 1px solid #dee2e6; font-size: 13px; }
    th { background: #212529; color: white; }
    .badge-status { padding: 4px 8px; border-radius: 4px; font-weight: bold; color: white; font-size: 11px; }
  </style>
</head>
<body>

  <!-- HEADER UTAMA -->
  <div class="main-header">
    <div class="timeframe-group">
      <button class="style-btn active" data-style="scalping">⚡ Scalping (15m)</button>
      <button class="style-btn" data-style="swing">🌊 Swing (1D)</button>
      <button class="style-btn" data-style="investing">🏦 Investasi (1W)</button>
    </div>
    
    <button class="refresh-btn" onclick="initScreener()">🔄 Refresh Data</button>
  </div>

  <div id="marketWarning"></div>
  <div id="screenerContainer"></div>

  <script src="app.js"></script>
</body>
</html>
