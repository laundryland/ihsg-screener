<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IHSG SH4NDY'S SCREENER - PRO</title>
  
  <style>
    * { 
      box-sizing: border-box; 
      margin: 0; 
      padding: 0; 
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; 
      user-select: none; 
      text-transform: uppercase; 
      font-weight: bold; 
    }

    body { 
      background-color: #0f172a; 
      color: #f8fafc; 
      padding: 16px; 
      padding-top: 20px; 
    }

    /* CONTAINER TABEL DENGAN SCROLL HORIZONTAL */
    .table-container {
      width: 100%;
      overflow-x: auto;
      border: 1px solid #334155;
      border-radius: 8px;
      background: #1e293b;
      margin-top: 15px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.75rem;
      white-space: nowrap;
    }

    th, td {
      padding: 10px 12px;
      text-align: center;
      border-bottom: 1px solid #334155;
    }

    th {
      background-color: #0f172a;
      color: #38bdf8;
    }

    /* STICKY COLUMN: KATEGORI & LABEL AGAR TIDAK IKUT SCROLL */
    .sticky-col {
      position: sticky;
      left: 0;
      background-color: #0f172a !important;
      z-index: 10;
      border-right: 2px solid #334155;
      text-align: left;
    }

    /* ANIMASI BLINK PANAH DAN STATUS ENTRY */
    @keyframes blink-animation {
      0% { opacity: 1; }
      50% { opacity: 0.2; }
      100% { opacity: 1; }
    }

    .arrow-red-blink {
      color: #ef4444;
      display: inline-block;
      margin: 0 6px;
      animation: blink-animation 0.8s infinite;
      font-size: 0.85rem;
    }

    .arrow-green-blink {
      color: #22c55e;
      display: inline-block;
      margin: 0 6px;
      animation: blink-animation 0.8s infinite;
      font-size: 0.85rem;
    }

    /* STYLE KOLOM STATUS ENTRY */
    .status-entry-box {
      padding: 6px 10px;
      border-radius: 4px;
      font-weight: 800;
      font-size: 0.7rem;
      display: inline-block;
    }

    .status-wait {
      background-color: #ef4444;
      color: #ffffff;
    }

    .status-signal-open {
      background-color: #22c55e;
      color: #ffffff;
      animation: blink-animation 0.8s infinite;
      box-shadow: 0 0 8px #22c55e;
    }

    .sup-val {
      font-weight: 800;
      color: #38bdf8;
    }
  </style>
</head>
<body>

  <h2>MONITORING STRATEGI PRO SCREENER</h2>

  <div class="table-container">
    <table>
      <thead>
        <tr>
          <th class="sticky-col">KATEGORI / EMITEN</th>
          <th>STATUS ENTRY</th>
          <th>AKSI / PERSENTASE</th>
          <th>HARGA RUNNING</th>
          <th>LEVEL SUPPORT</th>
          <th>SIGNAL STRATEGI</th>
        </tr>
      </thead>
      <tbody id="screenerTableBody">
        <!-- Data di-render melalui JavaScript -->
      </tbody>
    </table>
  </div>

  <script src="./screener-logic.js"></script>
</body>
</html>
