<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IHSG SH4NDY's SCREENER</title>
  
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#0f172a">
  <link rel="icon" type="image/png" sizes="192x192" href="./icon-192x192.png">
  <link rel="apple-touch-icon" href="./icon-192x192.png">
  
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; user-select: none; text-transform: uppercase; font-weight: bold; }
    body { background-color: #0f172a; color: #f8fafc; padding: 16px; padding-bottom: 40px; }
    
    /* Header & Navbar Sticky */
    .sticky-top-section {
      position: sticky;
      top: 0;
      z-index: 200;
      background-color: #0f172a;
      padding-top: 8px;
      padding-bottom: 8px;
      border-bottom: 1px solid #334155;
      margin-bottom: 12px;
    }

    .header-container { display: flex; align-items: center; justify-content: space-between; gap: 14px; flex-wrap: wrap; margin-bottom: 10px; }
    .header-left { display: flex; align-items: center; gap: 14px; }
    .app-logo { width: 48px; height: 48px; border-radius: 50%; object-fit: cover; flex-shrink: 0; border: 2px solid #38bdf8; }
    .header-text { display: flex; flex-direction: column; }
    h1 { font-size: 1.25rem; color: #38bdf8; letter-spacing: 0.5px; line-height: 1.2; }
    .update-time { font-size: 0.75rem; color: #94a3b8; margin-top: 3px; font-weight: normal; text-transform: none; }

    /* Timeframe Container Kolom */
    .timeframe-container { display: flex; gap: 6px; background: #161c24; padding: 4px; border-radius: 8px; border: 1px solid #334155; }
    .tf-btn { background: #0f172a; color: #94a3b8; border: 1px solid #334155; padding: 6px 12px; border-radius: 6px; font-size: 0.75rem; cursor: pointer; transition: all 0.2s; }
    .tf-btn.active { background: #0284c7; color: #fff; border: 1px solid #38bdf8; }

    /* Control Box */
    .control-box { 
      background: #1e293b; 
      padding: 10px 12px; 
      border-radius: 10px; 
      border: 1px solid #334155; 
      margin-bottom: 10px; 
    }
    .control-header { display: flex; justify-content: space-between; align-items: center; }
    .toggle-btn { background: #334155; color: #38bdf8; border: 1px solid #475569; padding: 4px 10px; border-radius: 6px; font-size: 0.75rem; cursor: pointer; }
    .form-row { margin-top: 8px; display: flex; flex-direction: column; gap: 8px; }
    .form-row.hidden { display: none; }
    
    /* Layout Pencarian dan Jam Digital */
    .search-clock-wrapper {
      display: flex;
      gap: 8px;
      align-items: center;
      width: 100%;
    }
    .search-input-box {
      flex: 1;
    }

    /* Box Jam Digital WIB */
    .digital-clock-box {
      background: #0f172a;
      border: 1px solid #334155;
      padding: 6px 10px;
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-width: 120px;
      text-align: center;
    }
    .clock-title { font-size: 0.6rem; color: #94a3b8; letter-spacing: 0.5px; }
    .clock-time { font-size: 0.95rem; font-family: monospace; font-weight: bold; margin-top: 2px; }
    .clock-open { color: #00ff66; text-shadow: 0 0 5px rgba(0,255,102,0.4); }
    .clock-closed { color: #94a3b8; }

    select, input[type="text"] { 
      width: 100%; 
      padding: 8px 12px; 
      border-radius: 8px; 
      border: 1px solid #475569; 
      background: #0f172a; 
      color: #fff; 
      font-size: 0.85rem; 
      outline: none;
    }

    /* Kategori Tabs Fixed */
    .group-tabs { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; }
    .tab { padding: 6px 12px; background: #161c24; border-radius: 8px; font-size: 0.75rem; white-space: nowrap; border: 1px solid #334155; color: #94a3b8; cursor: pointer; }
    .tab.active { background: #0284c7; color: #fff; border-color: #38bdf8; }

    /* Grid Kartu */
    .card-grid { display: grid; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); }
    
    .card { background: #1e293b; padding: 12px; border-radius: 12px; border: 1px solid #334155; position: relative; cursor: grab; transition: transform 0.15s, opacity 0.15s; }
    .card:active { cursor: grabbing; }
    .card.dragging { opacity: 0.4; transform: scale(0.96); border-style: dashed; }
    
    .card-ihsg { border: 2px solid #0284c7; background: #0f172a; cursor: default; }

    /* Sub Header Layout */
    .sub-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; gap: 6px; }
    .sub-header-right { display: flex; align-items: center; gap: 6px; }
    
    .group-tag { font-size: 0.68rem; color: #38bdf8; background: #0c4a6e; padding: 3px 6px; border-radius: 4px; border: 1px solid #0284c7; }

    /* Status Sinyal */
    .signal-status-tag {
      font-size: 0.68rem;
      padding: 3px 8px;
      border-radius: 4px;
      border: 1px solid transparent;
      color: #ffffff;
      text-align: center;
    }
    .tag-strong-buy { background: #15803d; border-color: #22c55e; color: #4ade80; }
    .tag-buy { background: #166534; border-color: #16a34a; color: #86efac; }
    .tag-netral { background: #334155; border-color: #475569; color: #cbd5e1; }
    .tag-sell { background: #991b1b; border-color: #dc2626; color: #fca5a5; }
    .tag-strong-sell { background: #b91c1c; border-color: #ef4444; color: #f87171; }

    /* Tombol X Dalam Kolom Hitam Sejajar */
    .close-btn-box {
      background: #161c24;
      border: 1px solid #334155;
      color: #ef4444;
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 0.75rem;
      cursor: pointer;
      transition: background-color 0.2s, color 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .close-btn-box:hover {
      background-color: #475569;
      color: #ffffff;
    }

    /* Warning Trend Box */
    .warning-box-top {
      background-color: #161c24;
      border: 1px solid #ef4444;
      padding: 5px;
      margin-bottom: 8px;
      border-radius: 6px;
      text-align: center;
    }
    .warning-box-top.green-border { border-color: #22c55e; }
    .warning-text { font-size: 0.7rem; letter-spacing: 0.5px; }

    /* Kolom Breakout Berkedip */
    .breakout-box {
      background-color: #161c24;
      padding: 5px;
      margin-bottom: 8px;
      border-radius: 6px;
      text-align: center;
      border: 1px solid transparent;
    }
    .breakout-up { border-color: #22c55e; color: #22c55e; }
    .breakout-down { border-color: #ef4444; color: #ef4444; }

    /* Kolom Nama Emiten & Harga */
    .ticker-price-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background-color: #161c24;
      border: 1px solid #2d3748;
      padding: 8px 10px;
      border-radius: 8px;
      margin-bottom: 8px;
    }
    .ticker-title { font-size: 1.1rem; color: #ffffff; display: flex; align-items: center; gap: 6px; }
    .price-display { font-size: 1.1rem; color: #ffffff; }

    .bg-bullish { background-color: #052e16 !important; border: 1px solid #22c55e !important; }
    .bg-bullish .ticker-title, .bg-bullish .price-display { color: #22c55e !important; }
    .bg-bearish { background-color: #450a0a !important; border: 1px solid #ef4444 !important; }
    .bg-bearish .ticker-title, .bg-bearish .price-display { color: #ef4444 !important; }

    @keyframes blink-animation {
      0% { opacity: 1; }
      50% { opacity: 0.2; }
      100% { opacity: 1; }
    }
    .blink-mode { animation: blink-animation 0.8s infinite; }

    /* Petir Volume */
    .lightning-box { font-size: 0.8rem; letter-spacing: -1px; }
    .lightning-green { color: #22c55e; }
    .lightning-red { color: #ef4444; }
    .lightning-white { color: #ffffff; }

    /* Persentase & Timeframe Kolom */
    .percent-middle-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; gap: 6px; }
    .open-percent-badge { font-size: 0.75rem; padding: 4px 8px; border-radius: 6px; background: #161c24; border: 1px solid #334155; }
    .timeframe-tag-box { font-size: 0.7rem; padding: 4px 8px; border-radius: 6px; background: #161c24; border: 1px solid #334155; color: #94a3b8; }
    .percent-green { color: #22c55e; }
    .percent-red { color: #ef4444; }
    .percent-white { color: #ffffff; }

    /* Penutupan Kemarin */
    .prev-close-container {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      background: #161c24;
      padding: 6px 8px;
      border-radius: 6px;
      border: 1px solid #334155;
      font-size: 0.72rem;
      margin-bottom: 8px;
    }
    .prev-label { color: #94a3b8; }
    .prev-val { color: #ffffff; font-size: 0.8rem; }

    /* Kolom Hitam Doff OHL Terpisah */
    .ohl-grid-container {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      margin-bottom: 8px;
    }
    .ohl-item-box {
      background-color: #161c24;
      border: 1px solid #2d3748;
      padding: 5px 8px;
      border-radius: 6px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.7rem;
    }
    .ohl-item-label { color: #94a3b8; }
    .ohl-item-val { color: #ffffff; }

    /* Kolom Hitam Doff Indikator & Volume */
    .doff-box {
      background-color: #161c24;
      border: 1px solid #2d3748;
      padding: 8px;
      border-radius: 8px;
      margin-bottom: 6px;
    }

    .ind-row { display: flex; justify-content: space-between; align-items: center; font-size: 0.72rem; margin-bottom: 4px; }
    .ind-row:last-child { margin-bottom: 0; }
    .ind-name { color: #94a3b8; }
    .ind-val-green { color: #22c55e; }
    .ind-val-red { color: #ef4444; }
    .ind-val-white { color: #ffffff; }

    /* Kotak Persentase Menyala */
    .multi-box-bar { display: flex; align-items: center; justify-content: space-between; gap: 3px; margin-top: 8px; padding-top: 6px; border-top: 1px solid #2d3748; }
    .boxes-grid { display: flex; gap: 2px; flex-grow: 1; }
    .box-step { height: 10px; flex: 1; border-radius: 2px; background-color: #334155; }
    .box-step.active-green { background-color: #00ff66; box-shadow: 0 0 6px #00ff66; }
    .box-step.active-red { background-color: #ff0055; box-shadow: 0 0 6px #ff0055; }
    .bar-percent-text { font-size: 0.7rem; color: #ffffff; margin-left: 6px; min-width: 32px; text-align: right; }

    /* Support & Resistance Box */
    .sr-stat-box { margin-top: 6px; padding: 6px; border-radius: 6px; background: #0f172a; border: 1px solid #334155; font-size: 0.68rem; color: #cbd5e1; }
    .sr-row { display: flex; justify-content: space-between; margin-bottom: 2px; align-items: center; }
    .sr-row:last-child { margin-bottom: 0; }
    .sr-res { color: #ef4444; }
    .sr-sup { color: #22c55e; }

    .sr-pivot-separator {
      background-color: #0f172a;
      border: 1px solid #ffffff;
      padding: 4px 6px;
      margin: 4px -6px;
      border-radius: 4px;
    }
    .pivot-label-yellow { color: #eab308; }
    .pivot-price-blue { color: #38bdf8; }
    .pivot-price-green { color: #22c55e; }
    .pivot-price-yellow { color: #eab308; }

    /* Ikon Panah/Kotak Pivot Berkedip */
    .pivot-icon-box {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 2px 6px;
      border-radius: 4px;
      border: 1px solid transparent;
      margin: 0 auto 0 4px;
      font-size: 0.75rem;
    }
    .pivot-icon-box.down { background: #450a0a; border-color: #ef4444; color: #ef4444; }
    .pivot-icon-box.up { background: #052e16; border-color: #22c55e; color: #22c55e; }
    .pivot-icon-box.equal { background: #1e293b; border-color: #94a3b8; color: #ffffff; }

    .signal-badge-container { margin: 8px 0 4px 0; }
    .badge-bar { display: block; width: 100%; height: 12px; border-radius: 4px; }
    .bg-signal-strong-buy { background: #22c55e; }
    .bg-signal-buy { background: #15803d; }
    .bg-signal-neutral { background: #475569; }
    .bg-signal-sell { background: #b91c1c; }
    .bg-signal-strong-sell { background: #ef4444; }

    .fibo-stat-box { margin-top: 4px; padding: 4px 6px; border-radius: 4px; background: #0f172a; border: 1px solid #334155; font-size: 0.68rem; text-align: center; }
    .fibo-oversold { color: #22c55e; border-color: #22c55e; }
    .fibo-overbought { color: #ef4444; border-color: #ef4444; }
    .fibo-normal { color: #64748b; }

    /* Trading Plan Box */
    .trading-plan-box { margin-top: 8px; padding: 8px 10px; background: #0f172a; border-radius: 8px; border: 1px dashed #475569; font-size: 0.72rem; }
    .plan-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
    .plan-row:last-child { margin-bottom: 0; }
    .plan-label { color: #94a3b8; }
    .val-wait { color: #f59e0b; }
    .val-active { color: #f8fafc; }

    /* Kolom Ringkasan Berita */
    .news-summary-box {
      margin-top: 8px;
      padding: 8px;
      background: #161c24;
      border: 1px solid #0284c7;
      border-radius: 6px;
      font-size: 0.7rem;
      text-transform: none;
      font-weight: normal;
    }
    .news-header { color: #38bdf8; font-weight: bold; font-size: 0.72rem; text-transform: uppercase; margin-bottom: 4px; display: flex; justify-content: space-between; }
    .news-content { color: #cbd5e1; line-height: 1.3; }

    /* Kolom Jadwal Buka-Tutup Perdagangan IHSG */
    .market-schedule-box {
      margin-top: 8px;
      padding: 8px;
      background: #161c24;
      border: 1px solid #334155;
      border-radius: 6px;
      font-size: 0.7rem;
    }
    .schedule-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: #38bdf8;
      font-weight: bold;
      font-size: 0.72rem;
      margin-bottom: 6px;
      padding-bottom: 4px;
      border-bottom: 1px solid #2d3748;
    }
    .schedule-list { display: flex; flex-direction: column; gap: 4px; }
    .schedule-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 3px 6px;
      border-radius: 4px;
      background: #0f172a;
    }
    .schedule-item.today {
      border: 1px solid #0284c7;
      background: #0c4a6e;
      font-size: 0.8rem;
      padding: 6px;
    }
    .day-name { font-weight: bold; }
    .day-time { font-family: monospace; }
    .status-open { color: #00ff66; text-shadow: 0 0 4px rgba(0,255,102,0.4); }
    .status-closed { color: #94a3b8; }
  </style>
</head>
<body>

  <!-- Sticky Header & Navigasi Menu -->
  <div class="sticky-top-section">
    <header>
      <div class="header-container">
        <div class="header-left">
          <img src="laundry1-512x512.png" alt="Logo" class="app-logo">
          <div class="header-text">
            <h1>IHSG SH4NDY's SCREENER</h1>
            <p class="update-time" id="updateTime">Memuat data...</p>
          </div>
        </div>
        <div class="timeframe-container">
          <button class="tf-btn active" onclick="setTimeframe('HARIAN', this)">HARIAN</button>
          <button class="tf-btn" onclick="setTimeframe('MINGGUAN', this)">MINGGUAN</button>
          <button class="tf-btn" onclick="setTimeframe('BULANAN', this)">BULANAN</button>
        </div>
      </div>
    </header>

    <div class="control-box">
      <div class="control-header">
        <span style="font-size: 0.8rem; color: #94a3b8;">MENU PILIH EMITEN</span>
        <button class="toggle-btn" onclick="toggleDropdownMenu()" id="toggleBtn">👁️ SEMBUNYIKAN MENU</button>
      </div>
      <div class="form-row" id="dropdownRow">
        <div class="search-clock-wrapper">
          <div class="search-input-box">
            <input type="text" id="searchInput" placeholder="🔍 CARI KODE EMITEN (CTH: BBCA)..." oninput="searchStock(this.value)">
          </div>
          <!-- Box Jam WIB Digital Terpisah Samping Pencarian -->
          <div class="digital-clock-box">
            <span class="clock-title">WAKTU WIB</span>
            <span class="clock-time" id="digitalClock">--:--:--</span>
          </div>
        </div>
        <select id="selectTickerOption" onchange="autoAddStock(this)">
          <option value="">-- PILIH EMITEN LANGSUNG TAMPIL --</option>
        </select>
      </div>
    </div>

    <div class="group-tabs" id="groupTabs">
      <div class="tab active" onclick="filterGroup('ALL', this)">SEMUA</div>
      <div class="tab" onclick="filterGroup('Perbankan', this)">PERBANKAN</div>
      <div class="tab" onclick="filterGroup('Energi', this)">ENERGI</div>
      <div class="tab" onclick="filterGroup('Tambang', this)">TAMBANG</div>
      <div class="tab" onclick="filterGroup('Teknologi', this)">TEKNOLOGI</div>
      <div class="tab" onclick="filterGroup('Media', this)">MEDIA</div>
      <div class="tab" onclick="filterGroup('Konsumer', this)">KONSUMER</div>
      <div class="tab" onclick="filterGroup('Properti', this)">PROPERTI</div>
      <div class="tab" onclick="filterGroup('Industri', this)">INDUSTRI</div>
    </div>
  </div>

  <div class="card-grid" id="stockGrid"></div>

  <script>
    let rawData = [];
    let stockOrder = JSON.parse(localStorage.getItem('stock_order')) || [];
    let isMenuVisible = JSON.parse(localStorage.getItem('menu_visible')) ?? true;
    let activeFilter = 'ALL';
    let currentTimeframe = 'HARIAN';
    let selectedNewsTicker = 'BBCA';
    let draggedTicker = null;

    // Logika Status Market Bursa Efek Indonesia (BEI/IHSG)
    function getMarketStatusInfo(dateObj = new Date()) {
      const day = dateObj.getDay(); // 0: Mingu, 1: Senin, ..., 6: Sabtu
      const hours = dateObj.getHours();
      const minutes = dateObj.getMinutes();
      const timeNum = hours * 100 + minutes;

      let isOpen = false;

      // Senin - Kamis
      if (day >= 1 && day <= 4) {
        if ((timeNum >= 900 && timeNum < 1130) || (timeNum >= 1330 && timeNum < 1549)) {
          isOpen = true;
        }
      } 
      // Jumat
      else if (day === 5) {
        if ((timeNum >= 900 && timeNum < 1130) || (timeNum >= 1400 && timeNum < 1549)) {
          isOpen = true;
        }
      }

      return { isOpen, dayIndex: day };
    }

    // Update Jam Digital WIB & Status Market Samping Pencarian
    function updateDigitalClock() {
      const now = new Date();
      const options = { timeZone: 'Asia/Jakarta', hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false };
      const timeString = now.toLocaleTimeString('id-ID', options);
      
      const clockEl = document.getElementById('digitalClock');
      const { isOpen } = getMarketStatusInfo(now);

      if (clockEl) {
        clockEl.innerText = timeString + " WIB";
        if (isOpen) {
          clockEl.className = "clock-time clock-open";
        } else {
          clockEl.className = "clock-time clock-closed";
        }
      }
    }
    setInterval(updateDigitalClock, 1000);

    function formatWIB(timeStr) {
      if (!timeStr) return "-";
      try {
        const date = new Date(timeStr);
        if (isNaN(date.getTime())) return timeStr;
        return date.toLocaleString('id-ID', {
          timeZone: 'Asia/Jakarta', day: '2-digit', month: 'long', year: 'numeric', hour: '2-digit', minute: '2-digit'
        }) + " WIB";
      } catch (e) { return timeStr; }
    }

    function formatNum(val) {
      if (val === undefined || val === null || isNaN(val)) return '0';
      return Number(val).toLocaleString('id-ID');
    }

    async function loadData() {
      try {
        const res = await fetch('./data.json?v=' + Date.now(), { cache: 'no-store' });
        const data = await res.json();
        
        document.getElementById('updateTime').innerText = "Diperbarui: " + formatWIB(data.updated_at);
        rawData = data.stocks || [];

        initMenuState();
        populateDropdownOptions();
        render();
        updateDigitalClock();
      } catch (e) {
        document.getElementById('updateTime').innerText = "Gagal memuat data.json";
      }
    }

    function initMenuState() {
      const row = document.getElementById('dropdownRow');
      const btn = document.getElementById('toggleBtn');
      if (isMenuVisible) {
        row.classList.remove('hidden');
        btn.innerText = "👁️ SEMBUNYIKAN MENU";
      } else {
        row.classList.add('hidden');
        btn.innerText = "👁️ TAMPILKAN MENU";
      }
    }

    function toggleDropdownMenu() {
      isMenuVisible = !isMenuVisible;
      localStorage.setItem('menu_visible', JSON.stringify(isMenuVisible));
      initMenuState();
    }

    function setTimeframe(tf, el) {
      currentTimeframe = tf;
      document.querySelectorAll('.tf-btn').forEach(b => b.classList.remove('active'));
      el.classList.add('active');
      render();
    }

    function populateDropdownOptions() {
      const selectEl = document.getElementById('selectTickerOption');
      selectEl.innerHTML = '<option value="">-- PILIH EMITEN LANGSUNG TAMPIL --</option>';
      
      let sortedStocks = [...rawData].filter(s => s.ticker !== 'IHSG').sort((a, b) => a.ticker.localeCompare(b.ticker));

      sortedStocks.forEach(stock => {
        const option = document.createElement('option');
        option.value = stock.ticker;
        option.textContent = `${stock.ticker} (${stock.category || 'LAINNYA'})`;
        selectEl.appendChild(option);
      });
    }

    function autoAddStock(selectEl) {
      const ticker = selectEl.value;
      if (!ticker) return;

      if (!stockOrder.includes(ticker)) {
        stockOrder.push(ticker);
        saveState();
      }
      selectStockForNews(ticker);
      selectEl.value = '';
    }

    function searchStock(query) {
      const cleanQuery = query.trim().toUpperCase();
      if (!cleanQuery) return;

      const targetCard = document.querySelector(`.card[data-ticker="${cleanQuery}"]`);
      if (targetCard) {
        selectStockForNews(cleanQuery);
      } else {
        const foundData = rawData.find(s => s.ticker === cleanQuery);
        if (foundData) {
          if (!stockOrder.includes(cleanQuery)) {
            stockOrder.push(cleanQuery);
            saveState();
          }
          selectStockForNews(cleanQuery);
        }
      }
    }

    function selectStockForNews(ticker) {
      selectedNewsTicker = ticker;
      render();
      setTimeout(() => {
        const cardEl = document.querySelector(`.card[data-ticker="${ticker}"]`);
        if (cardEl) {
          cardEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }
      }, 100);
    }

    function getLightningIcons(volRatio = 1.0) {
      const ratio = parseFloat(volRatio) || 1.0;
      if (ratio >= 2.5) return '⚡⚡⚡⚡⚡';
      if (ratio >= 1.5) return '⚡⚡⚡';
      if (ratio >= 1.0) return '⚡⚡';
      return '⚡';
    }

    function getTimeframeData(stock, tf) {
      if (!stock.timeframes || !stock.timeframes[tf]) {
        return {
          open: stock.open ?? stock.price,
          high: stock.high ?? stock.price,
          low: stock.low ?? stock.price,
          prev_close: stock.prev_close ?? stock.price,
          rsi_status: stock.rsi_status || 'NEUTRAL',
          macd_status: stock.macd_status || 'NEUTRAL',
          vol_status: stock.vol_status || 'NEUTRAL',
          ema_status: stock.ema_status || 'NEUTRAL',
          trend_status: stock.trend_status || 'SIDEWAYS',
          vol_ratio: stock.vol_ratio || 1.0,
          resistance_1: stock.resistance_1 || Math.round(stock.price * 1.02),
          support_1: stock.support_1 || Math.round(stock.price * 0.98),
          pivot: stock.pivot || Math.round(( (stock.high ?? stock.price) + (stock.low ?? stock.price) + stock.price ) / 3)
        };
      }
      return stock.timeframes[tf];
    }

    function createCardElement(stock, isIHSG = false) {
      const group = isIHSG ? 'INDEKS UTAMA' : (stock.category || 'LAINNYA');
      const tfData = isIHSG ? stock : getTimeframeData(stock, currentTimeframe);

      const openPrice = tfData.open ?? stock.price;
      const closePrice = stock.price ?? 0;
      const prevClose = tfData.prev_close ?? openPrice;
      const highPrice = tfData.high ?? closePrice;
      const lowPrice = tfData.low ?? closePrice;

      // Hitung % Selisih
      let openPercentVal = 0;
      if (openPrice > 0) {
        openPercentVal = ((closePrice - openPrice) / openPrice) * 100;
      }
      const openPercentSign = openPercentVal > 0 ? '+' : '';
      const openPercentStr = `${openPercentSign}${openPercentVal.toFixed(2)}%`;
      
      let percentClass = 'percent-white';
      if (openPercentVal > 0) percentClass = 'percent-green';
      else if (openPercentVal < 0) percentClass = 'percent-red';

      // Evaluasi Indikator Sesuai Timeframe
      let score = 0;
      let totalMaxScore = 5;

      let rsiStatus = tfData.rsi_status || 'NEUTRAL';
      if (rsiStatus === 'BUY') score += 1; else if (rsiStatus === 'SELL') score -= 1;

      let macdStatus = tfData.macd_status || 'NEUTRAL';
      if (macdStatus === 'BUY') score += 1; else if (macdStatus === 'SELL') score -= 1;

      let volStatus = tfData.vol_status || 'NEUTRAL';
      if (volStatus === 'BUY') score += 1; else if (volStatus === 'SELL') score -= 1;

      let emaStatus = tfData.ema_status || (closePrice >= (tfData.ma20 || closePrice) ? 'BUY' : 'SELL');
      if (emaStatus === 'BUY') score += 1; else if (emaStatus === 'SELL') score -= 1;

      let rawTrend = (tfData.trend_status || '').toUpperCase();
      let trendStatus = 'SIDEWAYS';
      if (rawTrend.includes('BULL') || rawTrend === 'BUY') { score += 1; trendStatus = 'BULLISH'; }
      else if (rawTrend.includes('BEAR') || rawTrend === 'SELL') { score -= 1; trendStatus = 'BEARISH'; }

      // Hitung Persentase Kekuatan Sinyal
      let absScore = Math.abs(score);
      let calcPercent = Math.min(100, Math.max(10, Math.round((absScore / totalMaxScore) * 100)));
      if (absScore === 0) calcPercent = 50;

      // Status Sinyal Teks
      let signalTagText = 'NETRAL';
      let signalTagClass = 'tag-netral';
      let isStrongBuy = false;

      if (score >= 4) { signalTagText = 'STRONG BUY'; signalTagClass = 'tag-strong-buy'; isStrongBuy = true; }
      else if (score >= 1) { signalTagText = 'BUY'; signalTagClass = 'tag-buy'; }
      else if (score <= -4) { signalTagText = 'STRONG SELL'; signalTagClass = 'tag-strong-sell'; }
      else if (score <= -1) { signalTagText = 'SELL'; signalTagClass = 'tag-sell'; }

      // Gaya Kolom Emiten
      let rowColorClass = '';
      if (score >= 4) rowColorClass = 'bg-bullish blink-mode';
      else if (score >= 1) rowColorClass = 'bg-bullish';
      else if (score <= -4) rowColorClass = 'bg-bearish blink-mode';
      else if (score <= -1) rowColorClass = 'bg-bearish';

      // 10 Kotak Daya Beli/Jual
      let boxesHtml = '';
      let boxCount = Math.round(calcPercent / 10);
      let activeBoxClass = score >= 0 ? 'active-green' : 'active-red';

      for (let i = 1; i <= 10; i++) {
        if (i <= boxCount) {
          boxesHtml += `<div class="box-step ${activeBoxClass}"></div>`;
        } else {
          boxesHtml += `<div class="box-step"></div>`;
        }
      }

      // Petir Berkedip Jika Strong Buy
      const vRatio = parseFloat(tfData.vol_ratio) || 1.0;
      let lightningClass = 'lightning-white';
      if (vRatio >= 1.2 || volStatus === 'BUY') lightningClass = 'lightning-green';
      else if (vRatio <= 0.8 || volStatus === 'SELL') lightningClass = 'lightning-red';

      const lightningBlinkClass = isStrongBuy ? 'blink-mode' : '';
      const lightningHtml = `<span class="lightning-box ${lightningClass} ${lightningBlinkClass}">${getLightningIcons(vRatio)}</span>`;

      // Indikator Volume Berkedip jika Volume Besar
      const isHighVol = vRatio >= 1.2 || volStatus === 'BUY' || volStatus === 'SELL';
      const volBlinkClass = isHighVol ? 'blink-mode' : '';
      const volColorClass = vRatio >= 1.2 || volStatus === 'BUY' ? 'ind-val-green' : vRatio <= 0.8 || volStatus === 'SELL' ? 'ind-val-red' : 'ind-val-white';

      // Warning Box Di Atas Kolom Emiten
      let warningHtml = '';
      const isReversalDown = (closePrice < openPrice && trendStatus === 'BULLISH') || trendStatus === 'BEARISH';
      const isReversalUp = (closePrice > openPrice && trendStatus === 'BEARISH') || trendStatus === 'BULLISH';

      if (!isIHSG) {
        if (trendStatus === 'BEARISH' || isReversalDown) {
          warningHtml = '<div class="warning-box-top"><div class="warning-text percent-red blink-mode">⚠️ WARNING! TREND TURUN!</div></div>';
        } else if (trendStatus === 'BULLISH' || isReversalUp) {
          warningHtml = '<div class="warning-box-top green-border"><div class="warning-text percent-green blink-mode">⚠️ WARNING! TREND NAIK!</div></div>';
        }
      }

      // Support & Resistance & Breakout Status
      const r1 = tfData.resistance_1 || Math.round(closePrice * 1.02);
      const r2 = tfData.resistance_2 || Math.round(r1 * 1.02);
      const r3 = tfData.resistance_3 || Math.round(r2 * 1.02);
      const s1 = tfData.support_1 || Math.round(closePrice * 0.98);
      const s2 = tfData.support_2 || Math.round(s1 * 0.98);
      const s3 = tfData.support_3 || Math.round(s2 * 0.98);

      // Hitung atau Ambil Pivot Point secara Presisi
      const calculatedPivot = Math.round((highPrice + lowPrice + closePrice) / 3);
      const pivotPoint = tfData.pivot || calculatedPivot;

      // Deteksi Breakout
      let breakoutHtml = '';
      if (!isIHSG) {
        if (closePrice > r1) {
          breakoutHtml = '<div class="breakout-box breakout-up blink-mode">🚀 BREAKOUT! UP</div>';
        } else if (closePrice < s1) {
          breakoutHtml = '<div class="breakout-box breakout-down blink-mode">⚠️ BREAKOUT! DOWN</div>';
        }
      }

      // Evaluasi Ikon Panah & Warna Pivot Point
      let pivotPriceClass = 'pivot-price-yellow';
      let pivotIconHtml = '<span class="pivot-icon-box equal blink-mode">■</span>';

      if (closePrice > pivotPoint) {
        pivotPriceClass = 'pivot-price-green';
        pivotIconHtml = '<span class="pivot-icon-box up blink-mode">▲</span>';
      } else if (closePrice < pivotPoint) {
        pivotPriceClass = 'pivot-price-blue';
        pivotIconHtml = '<span class="pivot-icon-box down blink-mode">▼</span>';
      } else {
        if (closePrice >= prevClose) {
          pivotPriceClass = 'pivot-price-green';
          pivotIconHtml = '<span class="pivot-icon-box up blink-mode">▲</span>';
        } else {
          pivotPriceClass = 'pivot-price-blue';
          pivotIconHtml = '<span class="pivot-icon-box down blink-mode">▼</span>';
        }
      }

      // Status Kondisi IHSG
      let ihsgStatusTagText = closePrice > prevClose ? 'NAIK' : closePrice < prevClose ? 'TURUN' : 'FLAT';
      let ihsgStatusTagClass = closePrice > prevClose ? 'tag-buy' : closePrice < prevClose ? 'tag-sell' : 'tag-netral';

      // Mengambil Berita Terkait Emiten yang Dipilih
      let newsStockObj = rawData.find(s => s.ticker === selectedNewsTicker) || stock;
      let newsText = newsStockObj.news || `Belum ada berita baru untuk emiten ${selectedNewsTicker}. Perhatikan pergerakan harga dan indikator teknikal.`;

      // Render Kolom Jadwal Buka-Tutup Perdagangan IHSG
      const currentMarketState = getMarketStatusInfo(new Date());
      const daysList = [
        { name: 'SENIN', idx: 1, time: 'SESI 1: 09:00-11:30 | SESI 2: 13:30-15:49' },
        { name: 'SELASA', idx: 2, time: 'SESI 1: 09:00-11:30 | SESI 2: 13:30-15:49' },
        { name: 'RABU', idx: 3, time: 'SESI 1: 09:00-11:30 | SESI 2: 13:30-15:49' },
        { name: 'KAMIS', idx: 4, time: 'SESI 1: 09:00-11:30 | SESI 2: 13:30-15:49' },
        { name: 'JUMAT', idx: 5, time: 'SESI 1: 09:00-11:30 | SESI 2: 14:00-15:49' },
        { name: 'SABTU', idx: 6, time: 'TUTUP (LIBUR AKHIR PEKAN)' }
      ];

      let scheduleItemsHtml = '';
      daysList.forEach(d => {
        const isToday = currentMarketState.dayIndex === d.idx;
        let dayStatusClass = 'status-closed';
        let dayStatusText = 'CLOSED';

        if (isToday) {
          if (currentMarketState.isOpen) {
            dayStatusClass = 'status-open';
            dayStatusText = 'OPEN';
          } else {
            dayStatusClass = 'status-closed';
            dayStatusText = 'CLOSED';
          }
        }

        scheduleItemsHtml += `
          <div class="schedule-item ${isToday ? 'today' : ''}">
            <span class="day-name">${isToday ? '👉 ' : ''}${d.name} ${isToday ? '(HARI INI)' : ''}</span>
            <span class="day-time">${d.time}</span>
            <span class="${dayStatusClass}">${dayStatusText}</span>
          </div>
        `;
      });

      const card = document.createElement('div');
      card.className = `card ${isIHSG ? 'card-ihsg' : ''}`;
      card.dataset.ticker = stock.ticker;
      card.onclick = () => { if (!isIHSG) selectStockForNews(stock.ticker); };
      if (!isIHSG) card.draggable = true;

      card.innerHTML = `
        <div class="sub-header">
          <span class="group-tag">${group}</span>
          <div class="sub-header-right">
            <span class="signal-status-tag ${isIHSG ? ihsgStatusTagClass : signalTagClass}">${isIHSG ? ihsgStatusTagText : signalTagText}</span>
            ${!isIHSG ? `<button class="close-btn-box" onclick="event.stopPropagation(); removeStock('${stock.ticker}')">✕</button>` : ''}
          </div>
        </div>

        ${warningHtml}
        ${breakoutHtml}

        <div class="ticker-price-row ${rowColorClass}">
          <div class="ticker-title">
            ${stock.ticker} ${isIHSG ? '📌' : ''} ${!isIHSG ? lightningHtml : ''}
          </div>
          <div class="price-display">RP ${formatNum(closePrice)}</div>
        </div>

        <div class="percent-middle-row">
          <span class="open-percent-badge ${percentClass}">${openPercentStr}</span>
          <span class="timeframe-tag-box">TIMEFRAME: ${currentTimeframe}</span>
        </div>

        <div class="prev-close-container">
          <span class="prev-label">PENUTUPAN KEMARIN</span>
          <span class="prev-val">RP ${formatNum(prevClose)}</span>
        </div>

        <div class="ohl-grid-container">
          <div class="ohl-item-box">
            <span class="ohl-item-label">PREV</span>
            <span class="ohl-item-val">${formatNum(prevClose)}</span>
          </div>
          <div class="ohl-item-box">
            <span class="ohl-item-label">OPEN</span>
            <span class="ohl-item-val">${formatNum(openPrice)}</span>
          </div>
          <div class="ohl-item-box">
            <span class="ohl-item-label">HIGH</span>
            <span class="ohl-item-val">${formatNum(highPrice)}</span>
          </div>
          <div class="ohl-item-box">
            <span class="ohl-item-label">LOW</span>
            <span class="ohl-item-val">${formatNum(lowPrice)}</span>
          </div>
        </div>

        ${isIHSG ? `
          <div class="doff-box">
            <div class="multi-box-bar" style="margin-top:0; padding-top:0; border-top:none;">
              <div class="boxes-grid">
                ${boxesHtml}
              </div>
              <span class="bar-percent-text">${calcPercent}%</span>
            </div>
          </div>

          <!-- Kolom Ringkasan Berita Emiten -->
          <div class="news-summary-box">
            <div class="news-header">
              <span>📰 BERITA EMITEN: ${selectedNewsTicker}</span>
            </div>
            <div class="news-content">${newsText}</div>
          </div>

          <!-- Kolom Jam Buka Tutup Perdagangan IHSG (Senin - Sabtu) -->
          <div class="market-schedule-box">
            <div class="schedule-header">
              <span>🕒 JADWAL TRADING PERDAGANGAN IHSG (WIB)</span>
            </div>
            <div class="schedule-list">
              ${scheduleItemsHtml}
            </div>
          </div>
        ` : ''}

        ${!isIHSG ? `
          <div class="doff-box">
            <div class="ind-row"><span class="ind-name">RSI</span><span class="${rsiStatus === 'BUY' ? 'ind-val-green' : rsiStatus === 'SELL' ? 'ind-val-red' : 'ind-val-white'}">${rsiStatus}</span></div>
            <div class="ind-row"><span class="ind-name">MACD</span><span class="${macdStatus === 'BUY' ? 'ind-val-green' : macdStatus === 'SELL' ? 'ind-val-red' : 'ind-val-white'}">${macdStatus}</span></div>
            <div class="ind-row"><span class="ind-name">VOL</span><span class="${volStatus === 'BUY' ? 'ind-val-green' : volStatus === 'SELL' ? 'ind-val-red' : 'ind-val-white'}">${volStatus}</span></div>
            <div class="ind-row"><span class="ind-name">EMA</span><span class="${emaStatus === 'BUY' ? 'ind-val-green' : emaStatus === 'SELL' ? 'ind-val-red' : 'ind-val-white'}">${emaStatus}</span></div>
            <div class="ind-row"><span class="ind-name">TREND</span><span class="${trendStatus === 'BULLISH' ? 'ind-val-green' : trendStatus === 'BEARISH' ? 'ind-val-red' : 'ind-val-white'}">${trendStatus}</span></div>
            
            <div class="multi-box-bar">
              <div class="boxes-grid">
                ${boxesHtml}
              </div>
              <span class="bar-percent-text">${calcPercent}%</span>
            </div>
          </div>

          <div class="doff-box" style="font-size:0.72rem; text-align:center;">
            VOLUME: <span class="${volColorClass} ${volBlinkClass}">${vRatio}X RERATA</span>
          </div>

          <div class="sr-stat-box">
            <div class="sr-row"><span>RESISTAN 3 (R3):</span> <span class="sr-res">RP ${formatNum(r3)}</span></div>
            <div class="sr-row"><span>RESISTAN 2 (R2):</span> <span class="sr-res">RP ${formatNum(r2)}</span></div>
            <div class="sr-row"><span>RESISTAN 1 (R1):</span> <span class="sr-res">RP ${formatNum(r1)}</span></div>
            
            <div class="sr-row sr-pivot-separator">
              <span class="pivot-label-yellow">PIVOT POINT (P):</span>
              ${pivotIconHtml}
              <span class="${pivotPriceClass}">RP ${formatNum(pivotPoint)}</span>
            </div>

            <div class="sr-row"><span>SUPPORT 1 (S1):</span> <span class="sr-sup">RP ${formatNum(s1)}</span></div>
            <div class="sr-row"><span>SUPPORT 2 (S2):</span> <span class="sr-sup">RP ${formatNum(s2)}</span></div>
            <div class="sr-row"><span>SUPPORT 3 (S3):</span> <span class="sr-sup">RP ${formatNum(s3)}</span></div>
          </div>

          <div class="signal-badge-container">
            <div class="badge-bar ${signalBadgeBg}"></div>
          </div>

          <div class="fibo-stat-box ${fiboBoxClass}">
            ${fiboText}
          </div>

          <div class="trading-plan-box">
            <div class="plan-row">
              <span class="plan-label">ENTRY:</span>
              <span class="plan-value ${isReadyToBuy ? 'val-active' : 'val-wait'}">${entryVal}</span>
            </div>
            <div class="plan-row">
              <span class="plan-label">TAKE PROFIT:</span>
              <span class="plan-value ${isReadyToBuy ? 'val-active' : 'val-wait'}">${tpVal}</span>
            </div>
            <div class="plan-row">
              <span class="plan-label">CUT LOSS:</span>
              <span class="plan-value ${isReadyToBuy ? 'val-active' : 'val-wait'}">${clVal}</span>
            </div>
          </div>
        ` : ''}
      `;

      if (!isIHSG) {
        card.addEventListener('dragstart', handleDragStart);
        card.addEventListener('dragover', handleDragOver);
        card.addEventListener('drop', handleDrop);
        card.addEventListener('dragend', handleDragEnd);
      }

      return card;
    }

    function handleDragStart(e) {
      draggedTicker = this.dataset.ticker;
      this.classList.add('dragging');
      e.dataTransfer.effectAllowed = 'move';
    }

    function handleDragOver(e) {
      e.preventDefault();
      e.dataTransfer.dropEffect = 'move';
    }

    function handleDrop(e) {
      e.preventDefault();
      const targetTicker = this.dataset.ticker;

      if (draggedTicker && targetTicker && draggedTicker !== targetTicker) {
        const fromIndex = stockOrder.indexOf(draggedTicker);
        const toIndex = stockOrder.indexOf(targetTicker);

        if (fromIndex !== -1 && toIndex !== -1) {
          const [movedItem] = stockOrder.splice(fromIndex, 1);
          stockOrder.splice(toIndex, 0, movedItem);
          saveState();
          render();
        }
      }
    }

    function handleDragEnd() {
      this.classList.remove('dragging');
      draggedTicker = null;
    }

    function render() {
      const grid = document.getElementById('stockGrid');
      grid.innerHTML = '';

      let ihsgData = rawData.find(s => s.ticker === 'IHSG') || {
        ticker: 'IHSG', price: 0, open: 0, high: 0, low: 0, prev_close: 0
      };
      grid.appendChild(createCardElement(ihsgData, true));

      let nonIhsgStocks = rawData.filter(s => s.ticker !== 'IHSG');
      
      if (stockOrder.length === 0) {
        stockOrder = nonIhsgStocks.map(s => s.ticker);
        saveState();
      } else {
        nonIhsgStocks.forEach(s => {
          if (!stockOrder.includes(s.ticker)) {
            stockOrder.push(s.ticker);
          }
        });
      }

      let displayList = [];
      stockOrder.forEach(ticker => {
        let item = nonIhsgStocks.find(s => s.ticker === ticker);
        if (item) displayList.push(item);
      });

      displayList.forEach(stock => {
        const group = stock.category || 'LAINNYA';
        if (activeFilter !== 'ALL' && group !== activeFilter) return;

        grid.appendChild(createCardElement(stock, false));
      });
    }

    function removeStock(ticker) {
      stockOrder = stockOrder.filter(t => t !== ticker);
      saveState();
      render();
    }

    function filterGroup(group, el) {
      activeFilter = group;
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      el.classList.add('active');
      render();
    }

    function saveState() {
      localStorage.setItem('stock_order', JSON.stringify(stockOrder));
    }

    if ('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js');
    loadData();
  </script>
</body>
</html>
