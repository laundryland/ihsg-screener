<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IHSG SH4NDY Screener</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --accent-green: #22c55e;
            --accent-red: #ef4444;
            --accent-yellow: #eab308;
            --border-color: #334155;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 15px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 10px;
            margin-bottom: 15px;
        }

        .title-area h2 { margin: 0; font-size: 1.4rem; color: #38bdf8; }
        .info-badge { font-size: 0.85rem; color: #94a3b8; }

        .search-container {
            margin-bottom: 15px;
            display: flex;
            gap: 10px;
        }

        input[type="text"] {
            width: 100%;
            padding: 8px 12px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            background-color: var(--card-bg);
            color: #fff;
            font-size: 0.9rem;
        }

        .table-container {
            overflow-x: auto;
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background-color: var(--card-bg);
            font-size: 0.85rem;
            text-align: left;
        }

        th, td {
            padding: 10px 12px;
            border-bottom: 1px solid var(--border-color);
            white-space: nowrap;
        }

        th {
            background-color: #0f172a;
            color: #38bdf8;
            font-weight: 600;
        }

        tr:hover { background-color: #334155; }

        /* 10 Signal Boxes Grid */
        .signal-box-container {
            display: flex;
            gap: 2px;
            align-items: center;
        }

        .s-box {
            width: 10px;
            height: 14px;
            background-color: #475569;
            border-radius: 1px;
        }

        .s-box.active-green { background-color: var(--accent-green); }
        .s-box.active-red { background-color: var(--accent-red); }

        .badge {
            padding: 3px 8px;
            border-radius: 4px;
            font-weight: bold;
            font-size: 0.75rem;
            display: inline-block;
        }

        .badge-buy { background-color: rgba(34, 197, 94, 0.2); color: var(--accent-green); border: 1px solid var(--accent-green); }
        .badge-sell { background-color: rgba(239, 68, 68, 0.2); color: var(--accent-red); border: 1px solid var(--accent-red); }
        .badge-neutral { background-color: rgba(234, 179, 8, 0.2); color: var(--accent-yellow); border: 1px solid var(--accent-yellow); }

        .txt-green { color: var(--accent-green); font-weight: 600; }
        .txt-red { color: var(--accent-red); font-weight: 600; }
    </style>
</head>
<body>

    <div class="header">
        <div class="title-area">
            <h2>IHSG SH4NDY Screener</h2>
            <div class="info-badge" id="update-time">Memuat data...</div>
        </div>
        <div id="ihsg-status" class="badge">IHSG: --</div>
    </div>

    <div class="search-container">
        <input type="text" id="search" placeholder="Cari emiten (misal: BBCA, TLKM)..." onkeyup="filterTable()">
    </div>

    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>Emiten</th>
                    <th>Harga</th>
                    <th>% 1D</th>
                    <th>Kekuatan Sinyal (10 Kotak = 100%)</th>
                    <th>Aksi</th>
                    <th>RSI (14)</th>
                    <th>Vol Ratio</th>
                    <th>TP (+5%)</th>
                    <th>SL (-5%)</th>
                </tr>
            </thead>
            <tbody id="stock-table">
                <!-- Data Diisi Otomatis via JS -->
            </tbody>
        </table>
    </div>

    <script>
        let allStocks = [];

        async function loadData() {
            try {
                const response = await fetch('data.json');
                const data = await response.json();
                
                document.getElementById('update-time').innerText = `Update: ${data.updated}`;
                
                const ihsgEl = document.getElementById('ihsg-status');
                ihsgEl.innerText = `IHSG: ${data.ihsg > 0 ? '+' : ''}${data.ihsg}%`;
                ihsgEl.className = `badge ${data.ihsg >= 0 ? 'badge-buy' : 'badge-sell'}`;

                allStocks = data.stocks;
                renderTable(allStocks);
            } catch (err) {
                console.error("Gagal memuat data.json:", err);
            }
        }

        function calculateSignal(stock) {
            let score = 0;

            // Trend Logic (20%)
            if (stock.price > stock.ema20) score += 10;
            if (stock.ema20 > stock.ema50) score += 10;

            // RSI Logic (40%)
            if (stock.rsi >= 45 && stock.rsi <= 65) score += 40;
            else if (stock.rsi > 65 && stock.rsi <= 75) score += 20;
            else if (stock.rsi < 35) score += 30; // Potensi Rebound Oversold

            // Volume Logic (40%)
            if (stock.vol_ratio >= 1.5) score += 40;
            else if (stock.vol_ratio >= 1.0) score += 20;
            else score += 10;

            return Math.min(score, 100);
        }

        function renderTable(stocks) {
            const tbody = document.getElementById('stock-table');
            tbody.innerHTML = '';

            stocks.forEach(stock => {
                const power = calculateSignal(stock);
                
                // Analogi 1 Kotak = 10%
                const activeBoxes = Math.round(power / 10);
                const isBullish = stock.price >= stock.ema20;

                let boxesHtml = '';
                for (let i = 1; i <= 10; i++) {
                    if (i <= activeBoxes) {
                        boxesHtml += `<div class="s-box ${isBullish ? 'active-green' : 'active-red'}"></div>`;
                    } else {
                        boxesHtml += `<div class="s-box"></div>`;
                    }
                }

                let actionBadge = `<span class="badge badge-neutral">NEUTRAL</span>`;
                if (power >= 70) actionBadge = `<span class="badge badge-buy">STRONG BUY</span>`;
                else if (power >= 50) actionBadge = `<span class="badge badge-buy">BUY</span>`;
                else if (power <= 30) actionBadge = `<span class="badge badge-sell">SELL</span>`;

                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td><strong>${stock.ticker}</strong></td>
                    <td>${stock.price.toLocaleString('id-ID')}</td>
                    <td class="${stock.change >= 0 ? 'txt-green' : 'txt-red'}">${stock.change > 0 ? '+' : ''}${stock.change}%</td>
                    <td>
                        <div class="signal-box-container">
                            ${boxesHtml}
                            <span style="margin-left: 8px; font-weight: bold; font-size: 0.8rem;">${power}%</span>
                        </div>
                    </td>
                    <td>${actionBadge}</td>
                    <td>${stock.rsi}</td>
                    <td>${stock.vol_ratio}x</td>
                    <td class="txt-green">${stock.tp.toLocaleString('id-ID')}</td>
                    <td class="txt-red">${stock.sl.toLocaleString('id-ID')}</td>
                `;
                tbody.appendChild(tr);
            });
        }

        function filterTable() {
            const query = document.getElementById('search').value.toUpperCase();
            const filtered = allStocks.filter(s => s.ticker.includes(query));
            renderTable(filtered);
        }

        loadData();
    </script>
</body>
</html>
