<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>IHSG Stock Screener Table</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #0f172a; color: #f8fafc; padding: 24px; }
    
    .header-container { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 1px solid #334155; padding-bottom: 16px; }
    .title { font-size: 1.5rem; color: #38bdf8; font-weight: bold; }
    .update-time { font-size: 0.8rem; color: #94a3b8; margin-top: 4px; }

    /* Box Atribusi Gambar / Indikator */
    .attribution-box { background: #1e293b; border: 1px solid #334155; padding: 10px 14px; border-radius: 8px; font-size: 0.78rem; text-align: right; }
    .attribution-info { color: #7dd3fc; font-weight: bold; display: block; }
    .attribution-source { color: #94a3b8; }

    /* Wrapper Tabel Lebar */
    .table-wrapper { width: 100%; overflow-x: auto; border: 1px solid #334155; border-radius: 8px; }
    table { width: 100%; min-width: 1100px; border-collapse: collapse; text-align: left; font-size: 0.88rem; }
    th { background-color: #1e293b; color: #cbd5e1; padding: 14px; font-size: 0.75rem; text-transform: uppercase; border-bottom: 1px solid #334155; }
    td { padding: 12px 14px; border-bottom: 1px solid #1e293b; }
    tr:hover { background-color: #1e293b50; }

    /* Helper Classes */
    .text-right { text-align: right; }
    .text-center { text-align: center; }
    
    /* Badge Status Sinyal */
    .badge { padding: 4px 10px; border-radius: 12px; font-size: 0.72rem; font-weight: bold; display: inline-block; width: 110px; text-align: center; }
    .badge-strong-buy { background: #064e3b; color: #34d399; border: 1px solid #10b981; }
    .badge-buy { background: #14532d; color: #4ade80; border: 1px solid #22c55e; }
    .badge-strong-sell { background: #4c0519; color: #fda4af; border: 1px solid #f43f5e; }
    .badge-sell { background: #7f1d1d; color: #fca5a5; border: 1px solid #ef4444; }
    .badge-netral { background: #334155; color: #cbd5e1; border: 1px solid #475569; }

    /* Label Wait */
    .badge-wait { background: #451a03; color: #fbbf24; border: 1px solid #b45309; padding: 2px 8px; border-radius: 4px; font-size: 0.75rem; font-weight: bold; }
    
    .text-entry { color: #38bdf8; font-weight: bold; }
    .text-tp { color: #34d399; font-weight: bold; }
    .text-cl { color: #f87171; font-weight: bold; }
  </style>
</head>
<body>

  <div class="header-container">
    <div>
      <div class="title">IHSG Stock Screener Dashboard</div>
      <div class="update-time" id="updateTime">Memuat data...</div>
    </div>
    <div class="attribution-box" id="attributionBox" style="display: none;">
      <span class="attribution-info" id="attrInfo"></span>
      <span class="attribution-source" id="attrSource"></span>
    </div>
  </div>

  <div class="table-wrapper">
    <table>
      <thead>
        <tr>
          <th>Emiten</th>
          <th>Sektor</th>
          <th class="text-right">Harga</th>
          <th class="text-center">OHL (Open / High / Low)</th>
          <th class="text-center">Sinyal Utama</th>
          <th class="text-center">RSI</th>
          <th class="text-center">MACD</th>
          <th class="text-center">Fibo RSI</th>
          <th class="text-right">Entry Price</th>
          <th class="text-right">Take Profit</th>
          <th class="text-right">Cut Loss</th>
        </tr>
      </thead>
      <tbody id="tableBody"></tbody>
    </table>
  </div>

  <script>
    async function loadScreenerData() {
      try {
        const res = await fetch('./data.json?v=' + Date.now());
        const data = await res.json();
        
        document.getElementById('updateTime').innerText = 'Terakhir Diperbarui: ' + new Date(data.updated_at).toLocaleString('id-ID');

        const stocks = data.stocks || [];
        if (stocks.length > 0 && stocks[0].visual_indicator_info) {
          document.getElementById('attrInfo').innerText = '📊 ' + stocks[0].visual_indicator_info;
          document.getElementById('attrSource').innerText = 'Sumber: ' + stocks[0].image_source;
          document.getElementById('attributionBox').style.display = 'block';
        }

        const tbody = document.getElementById('tableBody');
        tbody.innerHTML = '';

        stocks.forEach(stock => {
          const isWait = stock.entry_price === "Wait";
          
          let badgeClass = 'badge-netral';
          if (stock.signal === 'STRONG BUY') badgeClass = 'badge-strong-buy';
          else if (stock.signal === 'BUY') badgeClass = 'badge-buy';
          else if (stock.signal === 'STRONG SELL') badgeClass = 'badge-strong-sell';
          else if (stock.signal === 'SELL') badgeClass = 'badge-sell';

          const entryHtml = isWait ? '<span class="badge-wait">Wait</span>' : `<span class="text-entry">Rp ${Number(stock.entry_price).toLocaleString('id-ID')}</span>`;
          const tpHtml = isWait ? '<span class="badge-wait">Wait</span>' : `<span class="text-tp">Rp ${Number(stock.take_profit).toLocaleString('id-ID')}</span>`;
          const clHtml = isWait ? '<span class="badge-wait">Wait</span>' : `<span class="text-cl">Rp ${Number(stock.cut_loss).toLocaleString('id-ID')}</span>`;

          const row = document.createElement('tr');
          row.innerHTML = `
            <td><strong>${stock.ticker}</strong> ${stock.ticker === 'IHSG' ? '📌' : ''}</td>
            <td style="color: #94a3b8; font-size: 0.8rem;">${stock.category}</td>
            <td class="text-right"><strong>Rp ${stock.price.toLocaleString('id-ID')}</strong></td>
            <td class="text-center" style="font-family: monospace; font-size: 0.8rem; color: #cbd5e1;">${stock.open} / ${stock.high} / ${stock.low}</td>
            <td class="text-center"><span class="badge ${badgeClass}">${stock.signal}</span></td>
            <td class="text-center">${stock.rsi}</td>
            <td class="text-center" style="color: ${stock.macd_status === 'BUY' ? '#4ade80' : '#fca5a5'}; font-weight: bold;">${stock.macd_status}</td>
            <td class="text-center">${stock.fibo_rsi_status}</td>
            <td class="text-right">${entryHtml}</td>
            <td class="text-right">${tpHtml}</td>
            <td class="text-right">${clHtml}</td>
          `;
          tbody.appendChild(row);
        });
      } catch (err) {
        console.error('Gagal memuat data.json:', err);
      }
    }

    loadScreenerData();
  </script>
</body>
</html>
