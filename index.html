<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Strategi Trading</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background-color: #f4f6f9;
            color: #333;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            font-weight: bold;
            display: block;
            margin-bottom: 8px;
        }
        select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 16px;
        }
        .card {
            border: 1px solid #ddd;
            border-radius: 6px;
            padding: 15px;
            margin-top: 15px;
            background-color: #fafafa;
        }
        .card h3 {
            margin-top: 0;
            color: #0056b3;
        }
        .badge {
            display: inline-block;
            background: #e0e0e0;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            margin-right: 5px;
        }
        ul {
            padding-left: 20px;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Pilih Strategi Trading</h2>
    
    <div class="form-group">
        <label for="strategySelect">Dropdown Strategi:</label>
        <select id="strategySelect" onchange="renderStrategyDetails()">
            <option value="">-- Pilih Strategi --</option>
            <!-- Opsi diisi secara dinamis dari data.json -->
        </select>
    </div>

    <div id="strategyDetail" class="card" style="display: none;">
        <h3 id="strategyTitle"></h3>
        <p id="strategyDesc"></p>
        
        <h4>Timeframes:</h4>
        <div id="strategyTimeframes"></div>
        
        <h4>Indikator:</h4>
        <div id="strategyIndicators"></div>

        <h4>Aturan Trading:</h4>
        <ul>
            <li><strong>Entry:</strong> <span id="ruleEntry"></span></li>
            <li><strong>Exit:</strong> <span id="ruleExit"></span></li>
            <li><strong>Stop Loss:</strong> <span id="ruleSL"></span></li>
            <li><strong>Take Profit:</strong> <span id="ruleTP"></span></li>
        </ul>
    </div>
</div>

<script>
    let globalData = [];

    // Mengambil data dari file data.json
    async function loadTradingData() {
        try {
            const response = await fetch('data.json');
            if (!response.ok) {
                throw new Error('Gagal memuat data.json');
            }
            const data = await response.json();
            
            // Hapus duplikat data berdasarkan ID jika ada
            globalData = removeDuplicates(data.strategies, 'id');
            
            populateDropdown(globalData);
        } catch (error) {
            console.error('Error:', error);
        }
    }

    // Fungsi utilitas untuk menghapus data duplikat
    function removeDuplicates(array, key) {
        return array.filter((item, index, self) =>
            index === self.findIndex((t) => t[key] === item[key])
        );
    }

    // Mengisi dropdown opsi (tanpa Scalping)
    function populateDropdown(strategies) {
        const selectElement = document.getElementById('strategySelect');
        selectElement.innerHTML = '<option value="">-- Pilih Strategi --</option>';

        strategies.forEach(strategy => {
            const option = document.createElement('option');
            option.value = strategy.id;
            option.textContent = strategy.name;
            selectElement.appendChild(option);
        });
    }

    // Menampilkan detail strategi yang dipilih
    function renderStrategyDetails() {
        const selectedId = document.getElementById('strategySelect').value;
        const detailContainer = document.getElementById('strategyDetail');

        if (!selectedId) {
            detailContainer.style.display = 'none';
            return;
        }

        const strategy = globalData.find(item => item.id === selectedId);

        if (strategy) {
            document.getElementById('strategyTitle').textContent = strategy.name;
            document.getElementById('strategyDesc').textContent = strategy.description;

            // Render Timeframes
            const tfContainer = document.getElementById('strategyTimeframes');
            tfContainer.innerHTML = strategy.timeframes.map(tf => `<span class="badge">${tf}</span>`).join('');

            // Render Indikator
            const indContainer = document.getElementById('strategyIndicators');
            indContainer.innerHTML = strategy.indicators.map(ind => `<span class="badge">${ind}</span>`).join('');

            // Render Aturan
            document.getElementById('ruleEntry').textContent = strategy.rules.entry;
            document.getElementById('ruleExit').textContent = strategy.rules.exit;
            document.getElementById('ruleSL').textContent = strategy.rules.stop_loss;
            document.getElementById('ruleTP').textContent = strategy.rules.take_profit;

            detailContainer.style.display = 'block';
        }
    }

    // Inisialisasi saat halaman selesai dimuat
    document.addEventListener('DOMContentLoaded', loadTradingData);
</script>

</body>
</html>
