name: IHSG Stock Screener Auto Update

on:
  schedule:
    # Berjalan Senin-Jumat jam 09:15 UTC (16:15 WIB)
    - cron: '15 9 * * 1-5'
  workflow_dispatch: # Memungkinkan jalankan manual via GitHub tombol Click

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Python
        uses: uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas

      - name: Run Screener Script
        run: python screener.py

      - name: Commit and Push Updated Data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          git diff-index --quiet HEAD || git commit -m "Auto update IHSG data"
          git push
