name: IHSG Stock Screener Auto Update

on:
  schedule:
    # Berjalan otomatis setiap jam 09:00 WIB (02:00 UTC) dari Senin-Jumat
    - cron: '0 2 * * 1-5'
  workflow_dispatch: # Memungkinkan tombol 'Run workflow' manual

jobs:
  build-and-run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas yfinance

      - name: Run Screener Script
        run: python screener.py

      - name: Commit and Push Updated Data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          git commit -m "Auto update data.json [skip ci]" || exit 0
          git push
