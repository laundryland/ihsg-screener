name: Update Stock Data

on:
  workflow_dispatch:
  push:
    paths:
      - 'screener.py'
      - '.github/workflows/*'
  schedule:
    # Berjalan tiap 15 menit saat jam kerja bursa (09:00 - 16:30 WIB)
    - cron: '*/15 2-9 * * 1-5'

jobs:
  run-screener:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas pytz

      - name: Run Screener Script
        run: python screener.py

      - name: Commit & Push JSON Update
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          git status
          git diff-index --quiet HEAD || git commit -m "auto: update stock data [skip ci]"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
