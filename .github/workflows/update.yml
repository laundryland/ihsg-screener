name: Auto Update Stock Screener

on:
  schedule:
    # Berjalan otomatis setiap jam 09:00, 12:00, dan 16:00 WIB (Senin-Jumat)
    - cron: '0 2,5,9 * * 1-5'
  workflow_dispatch: # Memungkinkan jalankan manual via tombol GitHub Actions

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas yfinance

      - name: Run Screener Script
        run: python screener.py

      - name: Commit and Push Updated Data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          git status
          git diff-index --quiet HEAD || git commit -m "Auto-update stock data [skip ci]"
          git push
